{% set ep = request.endpoint %}
<div class="space-y-1 mb-4">
    <p class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wider px-4 mb-2">Reports</p>
    <a href="{{ url_for('reports') }}"
       class="sidebar-item {% if ep == 'reports' %}sidebar-item-active{% endif %}">
        <i class="fas fa-chart-pie w-5"></i>
        <span>Class overview</span>
        {% if ep == 'reports' %}<i class="fas fa-check-circle ml-auto text-green-500"></i>{% else %}<i class="fas fa-chevron-right ml-auto text-gray-400 text-sm"></i>{% endif %}
    </a>
    <a href="{{ url_for('academic_reports') }}"
       class="sidebar-item {% if ep in ('academic_reports', 'academic_report_preview') %}sidebar-item-active{% endif %}">
        <i class="fas fa-file-export w-5"></i>
        <span>Academic reports</span>
        {% if ep in ('academic_reports', 'academic_report_preview') %}<i class="fas fa-check-circle ml-auto text-green-500"></i>{% else %}<i class="fas fa-chevron-right ml-auto text-gray-400 text-sm"></i>{% endif %}
    </a>
    <a href="{{ url_for('finance_overview') }}"
       class="sidebar-item {% if ep == 'finance_overview' %}sidebar-item-active{% endif %}">
        <i class="fas fa-coins w-5"></i>
        <span>Accounts reports</span>
        {% if ep == 'finance_overview' %}<i class="fas fa-check-circle ml-auto text-green-500"></i>{% else %}<i class="fas fa-chevron-right ml-auto text-gray-400 text-sm"></i>{% endif %}
    </a>
</div>
<a href="{{ url_for('dashboard_employee') }}"
   class="sidebar-item">
    <i class="fas fa-arrow-left w-5"></i>
    <span>Back to Dashboard</span>
</a>
