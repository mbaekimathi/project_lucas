{% set fy = financial_year_session|default({}) %}
<a href="{{ employee_dash_url('finance-settings') }}"
   class="acc-fy-session-badge group inline-flex items-center gap-2 rounded-xl border border-teal-200/80 bg-white/95 dark:bg-slate-900/95 px-3 py-2 text-xs font-semibold text-slate-700 dark:text-slate-100 shadow-md shadow-slate-900/5 ring-1 ring-black/5 backdrop-blur-sm transition hover:border-teal-400 hover:shadow-lg dark:border-teal-800/60 dark:shadow-black/20"
   title="{% if fy.is_configured %}{{ fy.financial_year_start_display }} — {{ fy.financial_year_end_display }}{% if fy.is_locked %} · Locked{% endif %}{% else %}No financial year set — open Finance settings{% endif %}">
    <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-teal-100 text-teal-700 dark:bg-teal-950/60 dark:text-teal-300">
        <i class="fas fa-calendar-check text-[11px]" aria-hidden="true"></i>
    </span>
    <span class="min-w-0 leading-tight">
        <span class="block text-[9px] font-bold uppercase tracking-[0.14em] text-slate-500 dark:text-slate-400">Financial year</span>
        {% if fy.is_configured %}
        <span class="block truncate tabular-nums text-slate-900 dark:text-white">{{ fy.year_label }}</span>
        {% else %}
        <span class="block text-amber-700 dark:text-amber-300">Not configured</span>
        {% endif %}
    </span>
    {% if fy.is_locked %}
    <i class="fas fa-lock text-[10px] text-amber-600 dark:text-amber-400 shrink-0" title="Locked" aria-hidden="true"></i>
    {% endif %}
</a>
