{# Print letterhead & footer styles — include once per page shell #}
{% include 'dashboards/includes/accounts_print_brand_vars.html' %}
{% include 'dashboards/includes/accounts_print_measure_styles.html' %}
<style>
/* —— Screen —— */
.acr-print-only,
.acr-print-footer {
    display: none !important;
}

.acr-print-footer-spacer {
    display: none !important;
}

/* Temporary measure pass (iframe print layout before @media print applies). */
html.acr-accounts-print-measure .acr-print-only,
html.acr-accounts-print-measure .acr-print-footer {
    display: block !important;
}

html.acr-accounts-print-measure body {
    box-sizing: border-box;
}

.acr-print-letterhead {
    color: var(--print-brand-ink, #0f172a);
}

.acr-print-letterhead__brand {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    justify-items: center;
    gap: 0.875rem 1.25rem;
    padding-bottom: 0.625rem;
    margin-bottom: 0.625rem;
    border-bottom: 2px solid var(--print-brand-border, var(--print-brand-primary, #800020));
}

.acr-print-letterhead__brand-left {
    display: flex;
    align-items: center;
    grid-column: 1;
    justify-self: start;
    align-self: center;
}

.acr-print-letterhead__brand-body {
    display: contents;
}

.acr-print-letterhead__school-block {
    grid-column: 2;
    justify-self: center;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 100%;
}

.acr-print-letterhead__brand-right {
    grid-column: 3;
    justify-self: end;
    align-self: center;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding-left: 0;
    margin-left: 0;
    border-left: 0;
}

.acr-print-letterhead__brand-right--empty {
    display: none !important;
}

.acr-print-letterhead__qr {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin: 0;
}

.acr-print-letterhead__qr-img {
    display: block;
    width: 5.75rem;
    height: 5.75rem;
    image-rendering: pixelated;
}

.acr-print-letterhead__qr-label {
    margin: 0.35rem 0 0;
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--print-brand-primary, #800020);
    line-height: 1.2;
}

.acr-print-letterhead__qr-hint {
    margin: 0;
    font-size: 0.5rem;
    color: var(--print-brand-muted, #64748b);
    line-height: 1.2;
}

.acr-print-letterhead__logo {
    width: 5rem;
    height: 5rem;
    max-width: 5rem;
    max-height: 5rem;
    object-fit: contain;
    object-position: center;
    flex-shrink: 0;
    border: none;
    border-radius: 0;
    background: none;
    box-shadow: none;
    padding: 0;
    margin: 0;
}

.acr-print-letterhead__contact-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: center;
    gap: 0.25rem 0.35rem;
}

.acr-print-letterhead__contact-row--empty {
    display: none !important;
}

.acr-print-letterhead__school {
    font-size: 1.125rem;
    font-weight: 700;
    color: var(--print-brand-ink, #0f172a);
    margin: 0;
    line-height: 1.15;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: center;
    width: 100%;
}

.acr-print-letterhead__school-contacts {
    margin: 0.35rem 0 0;
    padding: 0;
    width: max-content;
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
}

.acr-print-letterhead__school-contact--fy.acr-print-letterhead__contact-row--empty {
    display: none !important;
}

.acr-print-letterhead__school-contact {
    display: grid;
    grid-template-columns: auto auto;
    gap: 0.2rem 0.65rem;
    align-items: baseline;
    justify-content: center;
    margin: 0.14rem auto 0;
    line-height: 1.35;
    width: max-content;
    max-width: 100%;
}

.acr-print-letterhead__school-contact dt,
.acr-print-letterhead__school-contact dd {
    margin: 0;
}

.acr-print-letterhead__school-contact .acr-print-letterhead__detail-label {
    text-align: right;
    justify-self: end;
}

.acr-print-letterhead__school-contact .acr-print-letterhead__detail-value {
    text-align: left;
    justify-self: start;
    word-break: break-word;
}

.acr-print-letterhead__location {
    font-size: 0.6875rem;
    font-weight: 500;
    color: var(--print-brand-subtle, #334155);
    margin: 0.3rem 0 0;
    line-height: 1.35;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    text-align: center;
    width: 100%;
    max-width: 28rem;
}

.acr-print-letterhead__details {
    margin: 0;
    padding: 0;
}

.acr-print-letterhead__detail {
    margin: 0;
}

.acr-print-letterhead__detail--address {
    margin-bottom: 0.25rem;
}

.acr-print-letterhead__detail--address .acr-print-letterhead__detail-label,
.acr-print-letterhead__detail--address .acr-print-letterhead__detail-value {
    display: block;
}

.acr-print-letterhead__detail--contacts {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.2rem;
}

.acr-print-letterhead__contact-item {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: flex-end;
    gap: 0.25rem 0.35rem;
}

.acr-print-letterhead__detail-pair {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.3rem 0.4rem;
    margin: 0;
}

.acr-print-letterhead__detail-label {
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--print-brand-muted, #64748b);
    margin: 0;
}

.acr-print-letterhead__detail-value {
    font-size: 0.6875rem;
    font-weight: 500;
    color: #334155;
    margin: 0;
    line-height: 1.35;
}

.acr-print-letterhead__detail--address .acr-print-letterhead__detail-value {
    font-size: 0.6875rem;
    margin-top: 0.1rem;
}

.acr-print-letterhead__doc {
    margin-bottom: 0.75rem;
}

.acr-print-letterhead__title {
    font-size: 0.875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--print-brand-primary, #800020);
    margin: 0 0 0.4rem;
    line-height: 1.2;
}

.acr-print-letterhead__meta-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr));
    gap: 0.35rem 1rem;
    margin: 0;
    padding: 0;
}

.acr-print-letterhead__meta-item {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
    margin: 0;
}

.acr-print-letterhead__meta-item dt {
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--print-brand-muted, #64748b);
    margin: 0;
}

.acr-print-letterhead__meta-item dd {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--print-brand-ink, #0f172a);
    margin: 0;
    line-height: 1.3;
}

.acr-print-letterhead__meta-extra {
    margin: 0.35rem 0 0;
    font-size: 0.6875rem;
    color: #475569;
    line-height: 1.35;
}

/* —— Print —— */
@page accounts-print-sheet {
    size: A4 portrait;
    margin: 7mm 8mm 8mm;
}

@media print {
    .acc-fy-session-corner {
        display: none !important;
    }

    a[href]::after,
    a[href^="http"]::after,
    a[href^="/"]::after {
        content: none !important;
        display: none !important;
    }

    html.acr-accounts-print {
        page: accounts-print-sheet;
        height: 100%;
    }

    html.acr-accounts-print body {
        position: relative;
        box-sizing: border-box;
    }

    .acr-print-only {
        display: block !important;
    }

    .acr-print-letterhead {
        break-inside: avoid;
        page-break-inside: avoid;
    }

    .acr-print-letterhead__brand,
    .acr-print-letterhead__brand.acr-print-letterhead__brand--pinned {
        display: grid !important;
        grid-template-columns: auto 1fr auto !important;
        align-items: center !important;
        visibility: visible !important;
        position: static !important;
        width: 100% !important;
        margin: 0 0 2mm !important;
        padding: 0 0 1.5mm;
        background: #fff;
        border-bottom: 1.5px solid var(--print-brand-border, var(--print-brand-primary, #800020));
        box-sizing: border-box;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        align-items: center !important;
    }

    .acr-print-letterhead__school-block {
        grid-column: 2 !important;
        justify-self: center !important;
    }

    .acr-print-letterhead__brand-right {
        grid-column: 3 !important;
        justify-self: end !important;
        align-self: center !important;
        padding-left: 0 !important;
        border-left: 0 !important;
    }

    .acr-print-letterhead__doc {
        margin-bottom: 2mm;
        padding-top: 0;
    }

    .acr-print-footer,
    .acr-print-footer.acr-print-footer--pinned {
        display: block !important;
        visibility: visible !important;
        position: static !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 1.75mm 0 0;
        border-top: 1.5px solid var(--print-brand-border, var(--print-brand-primary, #800020));
        background: #fff;
        box-sizing: border-box;
        break-inside: avoid;
        page-break-inside: avoid;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .acr-print-footer-spacer {
        display: block !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        border: 0 !important;
        break-inside: avoid;
        page-break-inside: avoid;
        box-sizing: border-box;
    }

    .acr-print-flow {
        display: block;
        width: 100%;
        box-sizing: border-box;
    }

    .acr-print-footer__inner {
        max-width: 100%;
    }

    .acr-print-footer__row {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 1mm 4mm;
    }

    .acr-print-footer__row--sub {
        margin-top: 0.75mm;
        justify-content: space-between;
        align-items: center;
        gap: 2mm;
    }

    .acr-print-footer__school {
        font-size: 8pt;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--print-brand-ink, #0f172a);
    }

    .acr-print-footer__title {
        font-size: 8pt;
        font-weight: 600;
        color: var(--print-brand-primary, #800020);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        text-align: right;
    }

    .acr-print-footer__label {
        font-size: 7pt;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--print-brand-muted, #64748b);
    }

    .acr-print-footer__credit {
        font-size: 7pt;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--print-brand-muted, #64748b);
    }

    .acr-print-footer__page::before {
        content: "Page " counter(page) " of " counter(pages);
        font-size: 7pt;
        font-weight: 600;
        color: var(--print-brand-muted, #64748b);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .acr-print-footer__printed {
        font-size: 7.5pt;
        font-weight: 600;
        color: #334155;
        font-variant-numeric: tabular-nums;
    }

    html.acr-report-print-doc body,
    html.acr-pcb-print-doc body,
    html.fr-print-doc body,
    html.acr-accounts-print body {
        padding-bottom: 0 !important;
    }

    .acr-print-letterhead__brand {
        gap: 3mm 5mm;
        padding-bottom: 0;
        margin-bottom: 0;
    }

    .acr-print-letterhead__brand-left {
        grid-column: 1 !important;
        justify-self: start !important;
        align-self: center !important;
    }

    .acr-print-letterhead__school {
        font-size: 13pt;
        text-align: center;
    }

    .acr-print-letterhead__school-contacts {
        margin-top: 1.25mm;
    }

    .acr-print-letterhead__logo {
        width: 26mm;
        height: 26mm;
        max-width: 26mm;
        max-height: 26mm;
    }

    .acr-print-letterhead__school-contact {
        grid-template-columns: auto auto;
        gap: 0.5mm 2mm;
        margin-top: 0.5mm;
        margin-left: auto;
        margin-right: auto;
    }

    .acr-print-letterhead__location {
        font-size: 8pt;
        margin-top: 1mm;
        text-align: center;
    }

    .acr-print-letterhead__detail-label {
        font-size: 6.5pt;
    }

    .acr-print-letterhead__detail-value {
        font-size: 8pt;
    }

    .acr-print-letterhead__detail--address .acr-print-letterhead__detail-value {
        font-size: 8pt;
        margin-top: 0.3mm;
    }

    .acr-print-letterhead__detail--contacts {
        gap: 1mm;
    }

    .acr-print-letterhead__contact-row {
        gap: 0.5mm 1mm;
    }

    .acr-print-letterhead__brand-right {
        gap: 1mm;
    }

    .acr-print-letterhead__qr {
        margin-top: 0;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }

    .acr-print-letterhead__qr-img {
        width: 22mm !important;
        height: 22mm !important;
        max-width: none;
        max-height: none;
    }

    .acr-print-letterhead__qr-label {
        font-size: 6.5pt;
        margin-top: 1mm;
    }

    .acr-print-letterhead__qr-hint {
        font-size: 5.5pt;
    }

    .acr-print-letterhead__doc {
        margin-bottom: 3mm;
    }

    .acr-print-letterhead__title {
        font-size: 12pt;
        margin-bottom: 1.5mm;
    }

    .acr-print-letterhead__meta-grid {
        gap: 1mm 4mm;
    }

    .acr-print-letterhead__meta-item dt {
        font-size: 6.5pt;
    }

    .acr-print-letterhead__meta-item dd {
        font-size: 8.5pt;
    }

}
</style>
{% include 'dashboards/includes/accounts_print_report_typography.html' %}
<script>
{% include 'dashboards/includes/accounts_print_frame.js' %}
{% include 'dashboards/includes/accounts_print_footer_pin.js' %}
</script>
