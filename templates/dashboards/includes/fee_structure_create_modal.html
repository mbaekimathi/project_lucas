{# Create fee structure modal — fee_structures page #}
<!-- Fee Structure Creation Modal -->
<script>
// Define function before Alpine.js initializes
window.feeStructureCreateModal = function() {
    return {
        get feeStructureModalOpen() { 
            if (typeof Alpine !== 'undefined' && Alpine.store && Alpine.store('feeStructure')) {
                const isOpen = Alpine.store('feeStructure').isOpen;
                if (isOpen && this.existingFeeItems.length === 0) {
                    this.fetchExistingFeeItems();
                }
                return isOpen;
            }
            return false;
        },
        academicLevelId: '', // kept for backward compatibility in existing UI logic
        financeAccountId: '',
        financeAccounts: [
            {% if finance_accounts_picker %}
            {% for account in finance_accounts_picker %}
            {
                id: {{ account.id }},
                account_name: {{ account.account_name|tojson }},
                account_category: {{ account.account_category|tojson }},
                level_count: {{ account.level_count|default(0) }}
            }{% if not loop.last %},{% endif %}
            {% endfor %}
            {% endif %}
        ],
        accountLevelsLoading: false,
        selectedAcademicLevels: [],
        levelSelectionMode: 'multiple',
        academicYearId: '',
        termId: '',
        feeName: '',
        feeNameAutoGenerated: false,
        category: '', // Must be selected first
        feeItems: [],
        totalAmount: 0,
        loading: false,
        error: '',
        success: '',
        academicLevelHasStructure: false,
        conflictingAcademicLevels: [],
        existingFeeItems: [],
        showExistingItems: false,
        academicLevelsWithStructure: [], // Array of academic level IDs that have fee structures for selected term
        academicLevels: [],
        levelsByCategoryStandalone: [],
        levelCombinations: [],
        memberLevelIds: [],
        combinedLevelsLoading: false,
        combinedLevelsError: '',
        academicYears: [
            {% if academic_years %}
            {% for year in academic_years %}
            {
                id: {{ year.id }},
                year_name: '{{ year.year_name|replace("'", "\\'")|replace('"', '\\"') }}'
            }{% if not loop.last %},{% endif %}
            {% endfor %}
            {% endif %}
        ],
        terms: [
            {% if terms %}
            {% for term in terms %}
            {% if term.status == 'active' and (not term.is_locked or term.is_locked == False) %}
            {
                id: {{ term.id }},
                term_name: '{{ term.term_name|replace("'", "\\'")|replace('"', '\\"') }}',
                academic_year_id: {{ term.academic_year_id }},
                is_current: {% if term.is_current %}true{% else %}false{% endif %},
                start_date: '{{ term.start_date }}',
                end_date: '{{ term.end_date }}',
                is_locked: {% if term.is_locked %}true{% else %}false{% endif %}
            }{% if not loop.last %},{% endif %}
            {% endif %}
            {% endfor %}
            {% else %}
            // No terms available
            {% endif %}
        ],
        get filteredTerms() {
            if (!this.academicYearId) return [];
            const yearId = parseInt(this.academicYearId);
            // Filter by academic year and exclude locked terms
            const filtered = this.terms.filter(t => 
                parseInt(t.academic_year_id) === yearId && 
                (!t.is_locked || t.is_locked === false)
            );
            return filtered;
        },
        formatTermDisplay(term) {
            if (!term) return '';
            return term.term_name + (term.is_current ? ' · Current' : '');
        },
        get selectedAcademicLevelIds() {
            if (this.levelSelectionMode === 'all') {
                return this.academicLevels.map(l => parseInt(l.id));
            }
            return (this.selectedAcademicLevels || []).map(id => parseInt(id));
        },
        get levelsByCategoryAll() {
            const byCat = {};
            for (const level of this.academicLevels) {
                const cat = (level.level_category || '').trim() || 'Uncategorized';
                if (!byCat[cat]) byCat[cat] = [];
                byCat[cat].push({
                    id: level.id,
                    level_name: level.level_name,
                    level_category: cat,
                });
            }
            return Object.keys(byCat)
                .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()))
                .map(cat => ({
                    category: cat,
                    levels: byCat[cat].sort((a, b) =>
                        (a.level_name || '').toLowerCase().localeCompare((b.level_name || '').toLowerCase())
                    ),
                }));
        },
        get displayCategories() {
            if (this.levelSelectionMode === 'combined') {
                return this.levelsByCategoryStandalone;
            }
            return this.levelsByCategoryAll;
        },
        get showCombinedGroupsSection() {
            return this.levelSelectionMode === 'combined';
        },
        get selectedCombinationCount() {
            return (this.levelCombinations || []).filter(c => this.isCombinationFullySelected(c)).length;
        },
        get combinedSelectionSummary() {
            const comboCount = this.selectedCombinationCount;
            const standaloneCount = (this.selectedAcademicLevels || []).filter(
                id => !this.memberLevelIds.includes(parseInt(id))
            ).length;
            const parts = [];
            if (comboCount) parts.push(comboCount + ' combined group' + (comboCount !== 1 ? 's' : ''));
            if (standaloneCount) parts.push(standaloneCount + ' standalone level' + (standaloneCount !== 1 ? 's' : ''));
            return parts.length ? parts.join(', ') : '';
        },
        get levelsPickerReady() {
            return !!(this.financeAccountId && this.academicYearId && this.termId);
        },
        get financeAccountLevelsUrl() {
            if (!this.financeAccountId) return '';
            return {{ (employee_dash_url('student-fees/finance-account') ~ '/__ID__/academic-levels')|tojson }}.replace('__ID__', String(this.financeAccountId));
        },
        get selectionBadgeText() {
            if (this.levelSelectionMode === 'all') {
                return this.academicLevels.length + ' levels';
            }
            if (this.levelSelectionMode === 'combined' && this.combinedSelectionSummary) {
                return this.combinedSelectionSummary;
            }
            const n = this.selectedAcademicLevels.length;
            if (!n) return 'None selected';
            return n + ' level' + (n !== 1 ? 's' : '');
        },
        get validFeeItemsCount() {
            return (this.feeItems || []).filter(item => item.itemName && item.amount).length;
        },
        addFirstFeeItem() {
            if (!this.feeItems.length) this.addNewItem();
        },
        isLevelChecked(levelId) {
            if (this.levelSelectionMode === 'all') return true;
            return this.selectedAcademicLevels.includes(String(levelId));
        },
        async loadLevelsForFinanceAccount() {
            if (!this.financeAccountId) {
                this.academicLevels = [];
                this.levelCombinations = [];
                this.levelsByCategoryStandalone = [];
                this.memberLevelIds = [];
                this.selectedAcademicLevels = [];
                this.academicLevelId = '';
                return;
            }
            this.accountLevelsLoading = true;
            this.combinedLevelsError = '';
            try {
                const response = await fetch(this.financeAccountLevelsUrl);
                const data = await response.json();
                if (data.success) {
                    this.academicLevels = (data.academic_levels || []).map(l => ({
                        id: l.id,
                        level_name: l.level_name || '',
                        level_category: l.level_category || '',
                    }));
                    this.levelCombinations = data.level_combinations || [];
                    this.levelsByCategoryStandalone = data.levels_by_category || [];
                    this.memberLevelIds = data.member_level_ids || [];
                } else {
                    this.combinedLevelsError = data.message || 'Could not load levels for this account';
                    this.academicLevels = [];
                    this.levelCombinations = [];
                    this.levelsByCategoryStandalone = [];
                    this.memberLevelIds = [];
                }
            } catch (error) {
                console.error('Error loading finance account levels:', error);
                this.combinedLevelsError = 'Could not load levels for this finance account';
                this.academicLevels = [];
                this.levelCombinations = [];
                this.levelsByCategoryStandalone = [];
                this.memberLevelIds = [];
            } finally {
                this.accountLevelsLoading = false;
            }
        },
        async onFinanceAccountChange() {
            this.selectedAcademicLevels = [];
            this.academicLevelId = '';
            this.levelSelectionMode = 'multiple';
            this.academicLevelsWithStructure = [];
            this.feeNameAutoGenerated = true;
            await this.loadLevelsForFinanceAccount();
            this.updateFeeName();
            this.checkFeeStructuresForTerm();
            this.checkFeeStructureExists();
        },
        async fetchCombinedAcademicLevels() {
            if (!this.financeAccountId) {
                this.combinedLevelsError = 'Select a finance account first.';
                return;
            }
            this.combinedLevelsLoading = true;
            this.combinedLevelsError = '';
            try {
                const response = await fetch(this.financeAccountLevelsUrl);
                const data = await response.json();
                if (data.success) {
                    this.levelCombinations = data.level_combinations || [];
                    this.levelsByCategoryStandalone = data.levels_by_category || [];
                    this.memberLevelIds = data.member_level_ids || [];
                    this.academicLevels = (data.academic_levels || []).map(l => ({
                        id: l.id,
                        level_name: l.level_name || '',
                        level_category: l.level_category || '',
                    }));
                } else {
                    this.combinedLevelsError = data.message || 'Could not load combined academic levels';
                    this.levelCombinations = [];
                    this.levelsByCategoryStandalone = [];
                    this.memberLevelIds = [];
                }
            } catch (error) {
                console.error('Error fetching combined academic levels:', error);
                this.combinedLevelsError = 'Could not load combined academic levels';
            } finally {
                this.combinedLevelsLoading = false;
            }
        },
        async syncSelectionForMode() {
            if (this.levelSelectionMode === 'all') {
                this.selectedAcademicLevels = this.academicLevels.map(l => String(l.id));
            } else if (this.levelSelectionMode === 'single') {
                this.selectedAcademicLevels = this.selectedAcademicLevels.length
                    ? [this.selectedAcademicLevels[0]]
                    : [];
            } else if (this.levelSelectionMode === 'multiple') {
                this.selectedAcademicLevels = (this.selectedAcademicLevels || []).filter(id =>
                    this.academicLevels.some(l => String(l.id) === String(id))
                );
            } else if (this.levelSelectionMode === 'combined') {
                this.selectedAcademicLevels = [];
                await this.fetchCombinedAcademicLevels();
            }
            this.academicLevelId = this.selectedAcademicLevels.length
                ? this.selectedAcademicLevels[0]
                : '';
            this.feeNameAutoGenerated = true;
            this.updateFeeName();
            this.checkFeeStructureExists();
        },
        onLevelSelectionModeChange() {
            this.syncSelectionForMode();
        },
        isLevelInCombination(levelId) {
            return this.memberLevelIds.includes(parseInt(levelId));
        },
        isCombinationFullySelected(combo) {
            const ids = (combo.member_level_ids || []).map(id => String(id));
            return ids.length > 0 && ids.every(id => this.selectedAcademicLevels.includes(id));
        },
        combinationHasConflict(combo) {
            return (combo.member_level_ids || []).some(id => this.hasFeeStructureForTerm(id));
        },
        toggleCombination(combo) {
            if (this.levelSelectionMode !== 'combined') return;
            const ids = (combo.member_level_ids || []).map(id => String(id));
            if (this.isCombinationFullySelected(combo)) {
                this.selectedAcademicLevels = this.selectedAcademicLevels.filter(x => !ids.includes(x));
            } else {
                const merged = new Set([...this.selectedAcademicLevels, ...ids]);
                this.selectedAcademicLevels = Array.from(merged);
            }
            this.academicLevelId = this.selectedAcademicLevels.length ? this.selectedAcademicLevels[0] : '';
            this.feeNameAutoGenerated = true;
            this.updateFeeName();
            this.checkFeeStructureExists();
        },
        toggleCategoryLevels(section) {
            if (this.levelSelectionMode !== 'combined') return;
            const ids = (section.levels || []).map(l => String(l.id));
            const allSelected = ids.length > 0 && ids.every(id => this.selectedAcademicLevels.includes(id));
            if (allSelected) {
                this.selectedAcademicLevels = this.selectedAcademicLevels.filter(x => !ids.includes(x));
            } else {
                const merged = new Set([...this.selectedAcademicLevels, ...ids]);
                this.selectedAcademicLevels = Array.from(merged);
            }
            this.academicLevelId = this.selectedAcademicLevels.length ? this.selectedAcademicLevels[0] : '';
            this.feeNameAutoGenerated = true;
            this.updateFeeName();
            this.checkFeeStructureExists();
        },
        isCategoryFullySelected(section) {
            const ids = (section.levels || []).map(l => String(l.id));
            return ids.length > 0 && ids.every(id => this.selectedAcademicLevels.includes(id));
        },
        toggleLevelSelection(levelId, checked) {
            const sid = String(levelId);
            if (this.levelSelectionMode === 'single') {
                this.selectedAcademicLevels = checked ? [sid] : [];
            } else if (this.levelSelectionMode === 'combined' && this.isLevelInCombination(levelId)) {
                return;
            } else if (checked && !this.selectedAcademicLevels.includes(sid)) {
                this.selectedAcademicLevels.push(sid);
            } else if (!checked) {
                this.selectedAcademicLevels = this.selectedAcademicLevels.filter(x => x !== sid);
            }
            this.academicLevelId = this.selectedAcademicLevels.length ? this.selectedAcademicLevels[0] : '';
            this.feeNameAutoGenerated = true;
            this.updateFeeName();
            this.checkFeeStructureExists();
        },
        toggleAllCombinedLevels() {
            const allIds = new Set();
            (this.levelCombinations || []).forEach(combo => {
                (combo.member_level_ids || []).forEach(id => allIds.add(String(id)));
            });
            (this.levelsByCategoryStandalone || []).forEach(section => {
                (section.levels || []).forEach(level => allIds.add(String(level.id)));
            });
            const target = Array.from(allIds);
            if (target.length && target.every(id => this.selectedAcademicLevels.includes(id))) {
                this.selectedAcademicLevels = [];
            } else {
                this.selectedAcademicLevels = target;
            }
            this.academicLevelId = this.selectedAcademicLevels.length ? this.selectedAcademicLevels[0] : '';
            this.feeNameAutoGenerated = true;
            this.updateFeeName();
            this.checkFeeStructureExists();
        },
        toggleAllAcademicLevels() {
            if (this.levelSelectionMode === 'combined') {
                this.toggleAllCombinedLevels();
                return;
            }
            if (this.selectedAcademicLevels.length === this.academicLevels.length) {
                this.selectedAcademicLevels = [];
            } else {
                this.selectedAcademicLevels = this.academicLevels.map(l => String(l.id));
            }
            this.feeNameAutoGenerated = true;
            this.updateFeeName();
            this.checkFeeStructureExists();
        },
        generateFeeName() {
            if (!this.academicYearId || !this.termId || this.selectedAcademicLevelIds.length === 0) {
                return '';
            }

            const year = this.academicYears.find(y => y.id == this.academicYearId);
            const term = this.filteredTerms.find(t => t.id == this.termId);

            if (year && term) {
                if (this.levelSelectionMode === 'all') {
                    return `ALL LEVELS - ${term.term_name} - ${year.year_name}`.toUpperCase();
                }
                if (this.levelSelectionMode === 'combined') {
                    const selectedCombos = (this.levelCombinations || []).filter(c =>
                        this.isCombinationFullySelected(c)
                    );
                    if (selectedCombos.length === 1 && this.selectedAcademicLevelIds.length === (selectedCombos[0].member_level_ids || []).length) {
                        return `${selectedCombos[0].label_name} - ${term.term_name} - ${year.year_name}`.toUpperCase();
                    }
                    if (selectedCombos.length > 0) {
                        const labels = selectedCombos.map(c => c.label_name).join(', ');
                        return `${labels} - ${term.term_name} - ${year.year_name}`.toUpperCase();
                    }
                }
                if (this.selectedAcademicLevelIds.length === 1) {
                    const level = this.academicLevels.find(l => parseInt(l.id) === parseInt(this.selectedAcademicLevelIds[0]));
                    if (level) {
                        return `${level.level_name} - ${term.term_name} - ${year.year_name}`.toUpperCase();
                    }
                }
                return `${this.selectedAcademicLevelIds.length} LEVELS - ${term.term_name} - ${year.year_name}`.toUpperCase();
            }
            return '';
        },
        updateFeeName() {
            if (this.feeNameAutoGenerated) {
                const generated = this.generateFeeName();
                if (generated) {
                    this.feeName = generated;
                }
            }
        },
        async fetchExistingFeeItems() {
            try {
                const response = await fetch('{{ employee_dash_url('student-fees/fee-items') }}');
                const data = await response.json();
                if (data.success && data.items) {
                    this.existingFeeItems = data.items;
                }
            } catch (error) {
                console.error('Error fetching existing fee items:', error);
            }
        },
        addExistingItem(item) {
            this.feeItems.push({
                itemName: item.item_name,
                itemDescription: item.item_description || '',
                amount: item.amount,
                isExisting: true
            });
            this.calculateTotal();
            this.showExistingItems = false;
        },
        addNewItem() {
            this.feeItems.push({ itemName: '', itemDescription: '', amount: '', isExisting: false });
            this.calculateTotal();
        },
        removeItem(index) {
            this.feeItems.splice(index, 1);
            this.calculateTotal();
        },
        calculateTotal() {
            this.totalAmount = this.feeItems.reduce((sum, item) => {
                return sum + (parseFloat(item.amount) || 0);
            }, 0);
        },
        async checkFeeStructuresForTerm() {
            // Check which academic levels have fee structures for the selected term, academic year, and category
            if (!this.academicYearId || !this.termId || !this.category) {
                this.academicLevelsWithStructure = [];
                return;
            }
            
            try {
                const response = await fetch({{ employee_dash_url('student-fees/check-fee-structures-for-term')|tojson }} + `?academic_year_id=${this.academicYearId}&term_id=${this.termId}&category=${encodeURIComponent(this.category)}`);
                const data = await response.json();
                
                if (data.academic_levels_with_structure) {
                    this.academicLevelsWithStructure = data.academic_levels_with_structure.map(id => parseInt(id));
                } else {
                    this.academicLevelsWithStructure = [];
                }
            } catch (error) {
                console.error('Error checking fee structures for term:', error);
                this.academicLevelsWithStructure = [];
            }
        },
        hasFeeStructureForTerm(academicLevelId) {
            return this.academicLevelsWithStructure.includes(parseInt(academicLevelId));
        },
        async checkFeeStructureExists() {
            const selectedIds = this.selectedAcademicLevelIds;
            if (!this.category || !this.academicYearId || !this.termId || selectedIds.length === 0) {
                this.academicLevelHasStructure = false;
                this.conflictingAcademicLevels = [];
                return;
            }

            this.conflictingAcademicLevels = this.academicLevels
                .filter(level => selectedIds.includes(parseInt(level.id)) && this.hasFeeStructureForTerm(level.id))
                .map(level => level.level_name);

            this.academicLevelHasStructure = this.conflictingAcademicLevels.length > 0;
            if (this.academicLevelHasStructure) {
                this.error = `Fee structure already exists for: ${this.conflictingAcademicLevels.join(', ')}. Unselect conflicting levels or choose another term/category.`;
            } else if (this.error && this.error.includes('Fee structure already exists for:')) {
                this.error = '';
            }
        },
        submitCreateForm() {
            this.loading = true;
            this.error = '';
            this.success = '';
            
            // Check if fee structure already exists for this combination
            if (this.academicLevelHasStructure) {
                // Error message is already set in checkFeeStructureExists()
                this.loading = false;
                return;
            }
            
            if (!this.financeAccountId) {
                this.error = 'Please select the finance account fees will be paid into.';
                this.loading = false;
                return;
            }

            const selectedIds = this.selectedAcademicLevelIds;
            if (selectedIds.length === 0) {
                this.error = 'Please select at least one academic level linked to this finance account.';
                this.loading = false;
                return;
            }

            // Validate category is selected
            if (!this.category) {
                this.error = 'Please select a category first.';
                this.loading = false;
                return;
            }
            
            // Validate that at least one fee item is provided
            const validItems = this.feeItems.filter(item => item.itemName && item.amount);
            if (validItems.length === 0) {
                this.error = 'Please add at least one fee item before creating the fee structure.';
                this.loading = false;
                return;
            }
            
            fetch('{{ employee_dash_url('student-fees/create-fee-structure') }}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    finance_account_id: parseInt(this.financeAccountId, 10),
                    academic_level_ids: selectedIds,
                    academic_year_id: this.academicYearId,
                    term_id: this.termId,
                    fee_name: this.feeName,
                    category: this.category,
                    fee_items: validItems.map(item => ({
                        item_name: item.itemName.toUpperCase().trim(),
                        item_description: item.itemDescription ? item.itemDescription.trim() : '',
                        amount: parseFloat(item.amount) || 0
                    }))
                })
            })
            .then(r => r.json())
            .then(data => {
                this.loading = false;
                if (data.success) {
                    // Close the modal immediately
                    if (typeof Alpine !== 'undefined' && Alpine.store && Alpine.store('feeStructure')) {
                        Alpine.store('feeStructure').close();
                    }
                    // Redirect immediately
                    window.location.reload();
                } else {
                    this.error = data.message || 'Failed to create fee structure';
                }
            })
            .catch(err => {
                this.loading = false;
                this.error = 'An error occurred. Please try again.';
            });
        }
    };
};
</script>
<div x-data="window.feeStructureCreateModal()"
     class="fsm-root fixed inset-0 z-50"
     x-show="$store.feeStructure.isOpen"
     x-cloak
     style="display: none;"
     @keydown.escape.window="$store.feeStructure.close()"
     x-init="
        $watch('$store.feeStructure.isOpen', (value) => {
            if (value) {
                calculateTotal();
            } else {
                // Reset form when modal closes
                financeAccountId = '';
                academicLevels = [];
                levelsByCategoryStandalone = [];
                levelCombinations = [];
                memberLevelIds = [];
                accountLevelsLoading = false;
                combinedLevelsError = '';
                academicLevelId = '';
                selectedAcademicLevels = [];
                levelSelectionMode = 'multiple';
                academicYearId = '';
                termId = '';
                feeName = '';
                feeNameAutoGenerated = false;
                category = '';
                feeItems = [];
                existingFeeItems = [];
                showExistingItems = false;
                totalAmount = 0;
                error = '';
                success = '';
                academicLevelHasStructure = false;
                conflictingAcademicLevels = [];
            }
        });
        $watch('academicYearId', () => { termId = ''; });
        $watch('levelSelectionMode', () => syncSelectionForMode());
     ">
{% include 'dashboards/includes/fee_structure_create_modal_markup.html' %}
</div>

<script>
document.addEventListener('alpine:init', () => {
    if (!Alpine.store('feeStructure')) {
        Alpine.store('feeStructure', {
            isOpen: false,
            open() { this.isOpen = true; },
            close() { this.isOpen = false; }
        });
    }
});
</script>
