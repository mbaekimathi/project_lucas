    <div class="fsm-backdrop" @click="$store.feeStructure.close()" aria-hidden="true"></div>
    <div class="fsm-wrap">
        <div class="fsm-dialog" @click.stop role="dialog" aria-labelledby="fsm-create-title">
            <header class="fsm-header fsm-header--create">
                <div class="fsm-header__glow" aria-hidden="true"></div>
                <div class="fsm-header__main">
                    <span class="fsm-header__icon" aria-hidden="true"><i class="fas fa-coins"></i></span>
                    <div>
                        <p class="fsm-header__eyebrow">Student fees</p>
                        <h2 id="fsm-create-title">New fee structure</h2>
                    </div>
                </div>
                <button type="button" @click="$store.feeStructure.close()" class="fsm-close" aria-label="Close">
                    <i class="fas fa-times"></i>
                </button>
            </header>

            <form @submit.prevent="submitCreateForm()" class="fsm-form">
                <div class="fsm-body">
                    <div x-show="error" x-cloak class="fsm-alert fsm-alert--error">
                        <i class="fas fa-exclamation-circle shrink-0"></i>
                        <span x-text="error"></span>
                    </div>

                    <section class="fsm-panel">
                        <div class="fsm-panel__head">
                            <h3 class="fsm-panel__title"><i class="fas fa-sliders-h"></i> Setup</h3>
                        </div>
                        <div class="fsm-grid fsm-grid--2">
                            <div class="fsm-field fsm-field--full">
                                <label class="fsm-label">Finance account <span class="req">*</span></label>
                                <select class="fsm-select" x-model="financeAccountId" required @change="onFinanceAccountChange()">
                                    <option value="">Choose account</option>
                                    <template x-for="account in financeAccounts" :key="account.id">
                                        <option :value="account.id" x-text="account.account_name"></option>
                                    </template>
                                </select>
                                <p x-show="financeAccounts.length === 0" class="fsm-hint">
                                    <a href="{{ employee_dash_url('accounts') }}">Add an account</a> with levels first.
                                </p>
                                <p x-show="financeAccountId && accountLevelsLoading" class="fsm-hint"><i class="fas fa-spinner fa-spin"></i> Loading…</p>
                            </div>
                            <div class="fsm-field">
                                <label class="fsm-label">Year <span class="req">*</span></label>
                                <select class="fsm-select" x-model="academicYearId" required :disabled="!financeAccountId"
                                        @change="termId = ''; category = ''; selectedAcademicLevels = []; levelSelectionMode = 'multiple'; feeNameAutoGenerated = true; updateFeeName(); academicLevelsWithStructure = []; checkFeeStructureExists()">
                                    <option value="">Choose year</option>
                                    {% for year in academic_years %}
                                    <option value="{{ year.id }}">{{ year.year_name }}{% if year.is_current %} · Current{% endif %}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="fsm-field">
                                <label class="fsm-label">Term <span class="req">*</span></label>
                                <select class="fsm-select" x-model="termId" required :disabled="!financeAccountId || !academicYearId"
                                        @change="category = ''; selectedAcademicLevels = []; levelSelectionMode = 'multiple'; feeNameAutoGenerated = true; updateFeeName(); checkFeeStructuresForTerm(); checkFeeStructureExists()">
                                    <option value="">Choose term</option>
                                    <template x-for="term in filteredTerms" :key="term.id">
                                        <option :value="term.id" x-text="formatTermDisplay(term)"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="fsm-field">
                                <label class="fsm-label">Category <span class="req">*</span></label>
                                <select class="fsm-select" x-model="category" required :disabled="!financeAccountId || !academicYearId || !termId"
                                        @change="selectedAcademicLevels = []; levelSelectionMode = 'multiple'; feeNameAutoGenerated = true; updateFeeName(); checkFeeStructuresForTerm(); checkFeeStructureExists()">
                                    <option value="">Choose</option>
                                    <option value="both">Both</option>
                                    <option value="self sponsored">Self sponsored</option>
                                    <option value="sponsored">Sponsored</option>
                                </select>
                            </div>
                            <div class="fsm-field">
                                <label class="fsm-label">Levels</label>
                                <select class="fsm-select" x-model="levelSelectionMode" :disabled="!financeAccountId || !academicYearId || !termId"
                                        @change="onLevelSelectionModeChange()">
                                    <option value="single">One level</option>
                                    <option value="multiple">Multiple</option>
                                    <option value="combined">Combined groups</option>
                                    <option value="all">All account levels</option>
                                </select>
                            </div>
                        </div>
                    </section>

                    <section class="fsm-panel" x-show="financeAccountId">
                        <div class="fsm-panel__head">
                            <h3 class="fsm-panel__title"><i class="fas fa-layer-group"></i> Levels <span class="req">*</span></h3>
                            <span class="fsm-badge" x-text="selectionBadgeText" x-show="levelsPickerReady"></span>
                        </div>
                        <div x-show="!levelsPickerReady" class="fsm-empty">Pick year and term first.</div>
                        <template x-if="levelsPickerReady">
                            <div>
                                <div class="fsm-levels-toolbar" x-show="levelSelectionMode === 'multiple' || levelSelectionMode === 'combined'">
                                    <button type="button" class="fsm-btn-text"
                                            @click="levelSelectionMode === 'combined' ? toggleAllCombinedLevels() : toggleAllAcademicLevels()"
                                            x-text="selectedAcademicLevels.length ? 'Clear all' : 'Select all'"></button>
                                </div>
                                <div x-show="combinedLevelsLoading || accountLevelsLoading" class="fsm-hint text-center py-2"><i class="fas fa-spinner fa-spin"></i></div>
                                <div x-show="combinedLevelsError" class="fsm-alert fsm-alert--error text-xs mb-2" x-text="combinedLevelsError"></div>
                                <div class="fsm-levels-scroll" x-show="!combinedLevelsLoading && !accountLevelsLoading">
                                    <template x-if="showCombinedGroupsSection && levelCombinations.length">
                                        <div class="fsm-level-group">
                                            <div class="fsm-level-group-name">Groups</div>
                                            <div class="fsm-chips">
                                                <template x-for="combo in levelCombinations" :key="'c-' + combo.id">
                                                    <label class="fsm-chip"
                                                           :class="{ 'is-on': isCombinationFullySelected(combo), 'is-warn': combinationHasConflict(combo) }">
                                                        <input type="checkbox" :checked="isCombinationFullySelected(combo)" @change="toggleCombination(combo)">
                                                        <span x-text="combo.label_name"></span>
                                                    </label>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    <template x-for="section in displayCategories" :key="section.category + levelSelectionMode">
                                        <div class="fsm-level-group" x-show="section.levels && section.levels.length">
                                            <div class="fsm-level-group-name" x-text="section.category"></div>
                                            <div class="fsm-chips">
                                                <template x-for="level in section.levels" :key="level.id">
                                                    <label class="fsm-chip"
                                                           :class="{
                                                               'is-on': isLevelChecked(level.id),
                                                               'is-warn': hasFeeStructureForTerm(level.id),
                                                               'is-locked': levelSelectionMode === 'all'
                                                           }">
                                                        <input type="checkbox"
                                                               :checked="isLevelChecked(level.id)"
                                                               :disabled="levelSelectionMode === 'all' || (levelSelectionMode === 'combined' && isLevelInCombination(level.id))"
                                                               @change="toggleLevelSelection(level.id, $event.target.checked)">
                                                        <span x-text="level.level_name"></span>
                                                    </label>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    <p x-show="!displayCategories.length" class="fsm-hint text-center py-2">No levels on this account.</p>
                                </div>
                            </div>
                        </template>
                    </section>

                    <section class="fsm-panel fsm-panel--name">
                        <label class="fsm-label" for="fsm-create-fee-name">Fee name <span class="req">*</span></label>
                        <input id="fsm-create-fee-name" type="text" class="fsm-input uppercase" x-model="feeName" required
                               placeholder="AUTO-GENERATED"
                               @input="feeName = ($event.target.value || '').toUpperCase(); feeNameAutoGenerated = false">
                    </section>

                    <section class="fsm-panel">
                        <div class="fsm-panel__head">
                            <h3 class="fsm-panel__title"><i class="fas fa-receipt"></i> Votes <span class="req">*</span></h3>
                            <span class="fsm-badge" x-text="validFeeItemsCount + ' vote' + (validFeeItemsCount === 1 ? '' : 's')"></span>
                        </div>
                        <p class="fsm-hint mb-3">Vote amounts are per student. When you save, each active student in the selected class(es) and category receives every vote listed below.</p>
                        <div class="fsm-items-actions">
                            <button type="button" class="fsm-btn-add" @click="addNewItem()"><i class="fas fa-plus"></i> Add vote</button>
                            <button type="button" class="fsm-btn-ghost-sm"
                                    @click="showExistingItems = !showExistingItems; selectedLibraryIndices = []; if (!existingFeeItems.length) fetchExistingFeeItems()">
                                <i class="fas fa-book"></i> Library
                            </button>
                        </div>
                        <div x-show="showExistingItems" x-cloak class="fsm-library-panel">
                            <div class="fsm-library-toolbar" x-show="existingFeeItems.length">
                                <button type="button" class="fsm-btn-text"
                                        @click="toggleAllLibraryItems()"
                                        x-text="libraryToolbarLabel"></button>
                                <button type="button" class="fsm-btn-add fsm-btn-add--sm"
                                        @click="addSelectedLibraryItems()"
                                        :disabled="!selectedLibraryIndices.length">
                                    <i class="fas fa-plus"></i>
                                    <span x-text="selectedLibraryIndices.length ? ('Add ' + selectedLibraryIndices.length + ' vote' + (selectedLibraryIndices.length === 1 ? '' : 's')) : 'Add selected'"></span>
                                </button>
                            </div>
                            <div class="fsm-library">
                                <template x-for="(item, index) in existingFeeItems" :key="'lib-' + index + '-' + (item.item_name || '')">
                                    <label class="fsm-library-row"
                                           :class="{ 'is-selected': isLibraryItemSelected(index), 'is-added': isFeeItemDuplicate(item) }">
                                        <input type="checkbox"
                                               :checked="isLibraryItemSelected(index)"
                                               :disabled="isFeeItemDuplicate(item)"
                                               @change="toggleLibrarySelection(index)">
                                        <span class="fsm-library-name" x-text="item.item_name"></span>
                                        <span class="fsm-library-code" x-show="item.vote_code" x-text="item.vote_code"></span>
                                        <span class="fsm-library-amount" x-text="'KES ' + parseFloat(item.amount).toLocaleString()"></span>
                                    </label>
                                </template>
                                <p x-show="!existingFeeItems.length" class="fsm-hint">No saved votes.</p>
                            </div>
                        </div>
                        <div x-show="!feeItems.length" class="fsm-empty">
                            <button type="button" class="fsm-btn-add mt-2" @click="addFirstFeeItem()">Add first vote</button>
                        </div>
                        <div class="fsm-items">
                            <template x-for="(item, index) in feeItems" :key="index">
                                <div class="fsm-vote-row">
                                    <div class="fsm-vote-fields">
                                        <div class="fsm-vote-field">
                                            <label class="fsm-label-sm">Vote name <span class="req">*</span></label>
                                            <input type="text" class="fsm-input uppercase" x-model="item.itemName"
                                                   @input="item.itemName = item.itemName.toUpperCase()" placeholder="e.g. TUITION" required>
                                        </div>
                                        <div class="fsm-vote-field fsm-vote-field--code">
                                            <label class="fsm-label-sm">Vote code <span class="req">*</span></label>
                                            <input type="text" class="fsm-input uppercase" x-model="item.voteCode"
                                                   @input="item.voteCode = item.voteCode.toUpperCase()" placeholder="e.g. T01" required>
                                        </div>
                                        <div class="fsm-vote-field fsm-vote-field--amount">
                                            <label class="fsm-label-sm">Vote amount <span class="req">*</span></label>
                                            <div class="fsm-item-amount">
                                                <span>KES</span>
                                                <input type="number" class="fsm-input" x-model="item.amount" @input="calculateTotal()"
                                                       placeholder="0" step="0.01" min="0" required>
                                            </div>
                                        </div>
                                        <div class="fsm-vote-field fsm-vote-field--desc">
                                            <label class="fsm-label-sm">Vote description <span class="req">*</span></label>
                                            <textarea class="fsm-textarea uppercase" x-model="item.itemDescription" rows="2"
                                                      placeholder="e.g. TERM TUITION FEES"
                                                      @input="item.itemDescription = ($event.target.value || '').toUpperCase()" required></textarea>
                                        </div>
                                    </div>
                                    <div class="fsm-item-actions">
                                        <button type="button" class="fsm-item-remove" @click="removeItem(index)" aria-label="Remove vote">
                                            <i class="fas fa-trash-alt"></i>
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </section>
                </div>

                <footer class="fsm-footer">
                    <div class="fsm-total-card">
                        <span>Total</span>
                        <strong x-text="'KES ' + (totalAmount || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})"></strong>
                    </div>
                    <div class="fsm-footer-btns">
                        <button type="button" class="fsm-btn-cancel" @click="$store.feeStructure.close()">Cancel</button>
                        <button type="submit" class="fsm-btn-primary flex-1 sm:flex-none" :disabled="loading">
                            <i class="fas fa-spinner fa-spin" x-show="loading"></i>
                            <span x-text="loading ? 'Saving…' : 'Create'"></span>
                        </button>
                    </div>
                </footer>
            </form>
        </div>
    </div>
