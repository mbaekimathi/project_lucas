<style>
/* Fee structure details (view) modal */
.fsv-root {
    --fsv-teal: #14b8a6;
    --fsv-teal-deep: #0d9488;
    --fsv-ink: #0f172a;
    --fsv-muted: #64748b;
    --fsv-line: rgba(148, 163, 184, 0.35);
    --fsv-surface: #ffffff;
    --fsv-panel: #f8fafc;
    --fsv-radius: 1.25rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.dark .fsv-root {
    --fsv-ink: #f1f5f9;
    --fsv-muted: #94a3b8;
    --fsv-line: rgba(71, 85, 105, 0.65);
    --fsv-surface: #1e293b;
    --fsv-panel: rgba(15, 23, 42, 0.55);
}
.fsv-backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: rgba(15, 23, 42, 0.62);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}
.fsv-wrap {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
    pointer-events: none;
}
@media (min-width: 640px) {
    .fsv-wrap { align-items: center; padding: 1rem; }
}
.fsv-dialog {
    pointer-events: auto;
    width: 100%;
    max-width: 56rem;
    max-height: 94vh;
    max-height: 94dvh;
    display: flex;
    flex-direction: column;
    background: var(--fsv-surface);
    border-radius: var(--fsv-radius) var(--fsv-radius) 0 0;
    box-shadow: 0 -24px 64px rgba(15, 23, 42, 0.22), 0 0 0 1px var(--fsv-line);
    overflow: hidden;
    animation: fsv-slide-up 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
@media (min-width: 640px) {
    .fsv-dialog {
        border-radius: var(--fsv-radius);
        max-height: min(90vh, 820px);
        animation: fsv-scale-in 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }
}
@keyframes fsv-slide-up {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
@keyframes fsv-scale-in {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
}
.fsv-header {
    position: relative;
    flex-shrink: 0;
    padding: 1.1rem 1.25rem;
    background: linear-gradient(128deg, #0c4a6e 0%, #134e4a 42%, #0f766e 100%);
    color: #fff;
}
.fsv-header__glow {
    position: absolute;
    top: -40%;
    right: -5%;
    width: 45%;
    height: 160%;
    background: radial-gradient(ellipse, rgba(45, 212, 191, 0.35) 0%, transparent 68%);
    pointer-events: none;
}
.fsv-header__row {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
}
.fsv-header__main {
    display: flex;
    gap: 0.85rem;
    min-width: 0;
}
.fsv-header__icon {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.14);
    flex-shrink: 0;
    font-size: 1.1rem;
}
.fsv-eyebrow {
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.72);
    margin-bottom: 0.2rem;
}
.fsv-title {
    font-size: 1.125rem;
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -0.02em;
    word-break: break-word;
}
@media (min-width: 640px) { .fsv-title { font-size: 1.35rem; } }
.fsv-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.55rem;
}
.fsv-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.14);
    color: rgba(255, 255, 255, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.12);
}
.fsv-chip--live {
    background: rgba(34, 197, 94, 0.22);
    border-color: rgba(34, 197, 94, 0.35);
}
.fsv-close {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 0.65rem;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
    transition: background 0.15s;
}
.fsv-close:hover { background: rgba(255, 255, 255, 0.22); }

.fsv-summary {
    flex-shrink: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.5rem;
    padding: 0.85rem 1rem;
    background: var(--fsv-panel);
    border-bottom: 1px solid var(--fsv-line);
}
@media (min-width: 640px) {
    .fsv-summary { grid-template-columns: repeat(4, 1fr); gap: 0.65rem; padding: 1rem 1.25rem; }
}
.fsv-stat {
    padding: 0.65rem 0.75rem;
    border-radius: 0.75rem;
    background: var(--fsv-surface);
    border: 1px solid var(--fsv-line);
}
.fsv-stat__label {
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fsv-muted);
    margin-bottom: 0.25rem;
}
.fsv-stat__value {
    font-size: 0.9375rem;
    font-weight: 800;
    color: var(--fsv-ink);
    line-height: 1.2;
}
.fsv-stat__value--teal { color: var(--fsv-teal-deep); }
.fsv-stat__hint {
    font-size: 0.625rem;
    color: var(--fsv-muted);
    margin-top: 0.15rem;
}

.fsv-tabs {
    flex-shrink: 0;
    display: flex;
    gap: 0.25rem;
    padding: 0.65rem 1rem 0;
    border-bottom: 1px solid var(--fsv-line);
    background: var(--fsv-surface);
    overflow-x: auto;
    scrollbar-width: none;
}
.fsv-tabs::-webkit-scrollbar { display: none; }
.fsv-tab {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 0.85rem;
    border-radius: 0.65rem 0.65rem 0 0;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--fsv-muted);
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.fsv-tab:hover { color: var(--fsv-ink); background: var(--fsv-panel); }
.fsv-tab.is-active {
    color: var(--fsv-teal-deep);
    border-bottom-color: var(--fsv-teal);
    background: var(--fsv-panel);
}
.fsv-tab__count {
    min-width: 1.25rem;
    height: 1.25rem;
    padding: 0 0.35rem;
    border-radius: 999px;
    font-size: 0.625rem;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: rgba(20, 184, 166, 0.12);
    color: var(--fsv-teal-deep);
}
.fsv-tab:not(.is-active) .fsv-tab__count {
    background: rgba(100, 116, 139, 0.12);
    color: var(--fsv-muted);
}

.fsv-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 1rem 1.25rem 1.25rem;
    background: var(--fsv-panel);
}
.fsv-panel {
    background: var(--fsv-surface);
    border: 1px solid var(--fsv-line);
    border-radius: 0.85rem;
    overflow: hidden;
}
.fsv-panel + .fsv-panel { margin-top: 0.85rem; }
.fsv-panel__head {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--fsv-line);
    font-size: 0.6875rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--fsv-muted);
}
.fsv-dl {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
}
@media (min-width: 640px) {
    .fsv-dl { grid-template-columns: repeat(2, 1fr); }
}
.fsv-dl__item {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--fsv-line);
}
@media (min-width: 640px) {
    .fsv-dl__item:nth-child(odd) { border-right: 1px solid var(--fsv-line); }
    .fsv-dl__item:nth-last-child(-n+2) { border-bottom: none; }
}
.fsv-dl__item:last-child { border-bottom: none; }
.fsv-dl__label {
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fsv-muted);
    margin-bottom: 0.2rem;
}
.fsv-dl__value {
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--fsv-ink);
    word-break: break-word;
}
.fsv-dl__value--warn { color: #dc2626; }
.fsv-levels {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    margin-top: 0.15rem;
}
.fsv-level-pill {
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.6875rem;
    font-weight: 700;
    background: rgba(20, 184, 166, 0.1);
    color: var(--fsv-teal-deep);
    border: 1px solid rgba(20, 184, 166, 0.2);
}

.fsv-table-wrap { overflow-x: auto; }
.fsv-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8125rem;
}
.fsv-table th {
    text-align: left;
    padding: 0.65rem 1rem;
    font-size: 0.625rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fsv-muted);
    background: rgba(148, 163, 184, 0.08);
    border-bottom: 1px solid var(--fsv-line);
    white-space: nowrap;
}
.fsv-table th:last-child,
.fsv-table td:last-child { text-align: right; }
.fsv-table td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--fsv-line);
    color: var(--fsv-ink);
    vertical-align: top;
}
.fsv-table tr:last-child td { border-bottom: none; }
.fsv-table tr.fsv-table__total td {
    font-weight: 800;
    background: rgba(20, 184, 166, 0.06);
    border-top: 2px solid rgba(20, 184, 166, 0.25);
}
.fsv-vote-name { font-weight: 700; }
.fsv-vote-desc {
    font-size: 0.6875rem;
    color: var(--fsv-muted);
    margin-top: 0.15rem;
    line-height: 1.35;
}

.fsv-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
}
.fsv-search {
    position: relative;
    flex: 1;
    min-width: 10rem;
    max-width: 18rem;
}
.fsv-search i {
    position: absolute;
    left: 0.65rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.75rem;
    color: var(--fsv-muted);
    pointer-events: none;
}
.fsv-search input {
    width: 100%;
    padding: 0.5rem 0.65rem 0.5rem 2rem;
    border-radius: 0.55rem;
    border: 1px solid var(--fsv-line);
    background: var(--fsv-surface);
    font-size: 0.8125rem;
    color: var(--fsv-ink);
}
.fsv-search input:focus {
    outline: none;
    border-color: rgba(20, 184, 166, 0.5);
    box-shadow: 0 0 0 2px rgba(20, 184, 166, 0.15);
}

.fsv-student-list { display: flex; flex-direction: column; gap: 0.5rem; }
.fsv-student {
    border: 1px solid var(--fsv-line);
    border-radius: 0.75rem;
    background: var(--fsv-surface);
    overflow: hidden;
}
.fsv-student__head {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    text-align: left;
    transition: background 0.15s;
}
.fsv-student__head:hover { background: rgba(148, 163, 184, 0.06); }
.fsv-student__name {
    font-size: 0.875rem;
    font-weight: 800;
    color: var(--fsv-ink);
}
.fsv-student__meta {
    font-size: 0.6875rem;
    color: var(--fsv-muted);
    margin-top: 0.1rem;
}
.fsv-student__right {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    flex-shrink: 0;
}
.fsv-student__total {
    font-size: 0.8125rem;
    font-weight: 800;
    color: var(--fsv-teal-deep);
}
.fsv-student__chev {
    color: var(--fsv-muted);
    font-size: 0.75rem;
    transition: transform 0.2s;
}
.fsv-student.is-open .fsv-student__chev { transform: rotate(180deg); }
.fsv-student__body {
    border-top: 1px solid var(--fsv-line);
    padding: 0.5rem 1rem 0.75rem;
    background: rgba(148, 163, 184, 0.04);
}

.fsv-empty {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--fsv-muted);
}
.fsv-empty i {
    font-size: 2rem;
    opacity: 0.45;
    margin-bottom: 0.5rem;
    display: block;
}
.fsv-empty p { font-size: 0.875rem; font-weight: 600; }
.fsv-loading {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--fsv-muted);
    font-size: 0.875rem;
}
.fsv-alert {
    display: flex;
    gap: 0.5rem;
    align-items: flex-start;
    padding: 0.65rem 0.85rem;
    border-radius: 0.65rem;
    font-size: 0.8125rem;
    margin-bottom: 0.75rem;
    border: 1px solid #fecaca;
    background: #fef2f2;
    color: #991b1b;
}
.dark .fsv-alert {
    background: rgba(127, 29, 29, 0.25);
    border-color: rgba(248, 113, 113, 0.35);
    color: #fecaca;
}

.fsv-footer {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: flex-end;
    padding: 0.85rem 1.25rem;
    border-top: 1px solid var(--fsv-line);
    background: var(--fsv-surface);
}
.fsv-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1rem;
    border-radius: 0.6rem;
    font-size: 0.8125rem;
    font-weight: 700;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
}
.fsv-btn--ghost {
    color: var(--fsv-muted);
    border: 1px solid var(--fsv-line);
    background: var(--fsv-surface);
}
.fsv-btn--ghost:hover { background: var(--fsv-panel); color: var(--fsv-ink); }
.fsv-btn--primary {
    color: #fff;
    background: linear-gradient(135deg, var(--fsv-teal-deep), var(--fsv-teal));
    box-shadow: 0 4px 14px rgba(20, 184, 166, 0.3);
}
.fsv-btn--primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(20, 184, 166, 0.38);
}
.fsv-btn--edit {
    color: #fff;
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.28);
}
.fsv-btn--edit:hover { transform: translateY(-1px); }
</style>
