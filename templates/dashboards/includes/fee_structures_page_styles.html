<style>
/* Fee structures listing page — responsive, fits viewport */
.fs-page {
    --fs-teal: #14b8a6;
    --fs-teal-deep: #0d9488;
    --fs-ink: var(--acc-ink, #0f172a);
    --fs-muted: var(--acc-muted, #64748b);
    --fs-line: var(--acc-line, #e2e8f0);
    --fs-surface: var(--acc-surface, #fff);
    --fs-radius: 1rem;
    --fs-radius-lg: 1.25rem;
    overflow-x: clip;
}
.fs-page .accounts-page,
.fs-page-shell {
    min-width: 0;
    max-width: 100%;
}
.fs-page-shell {
    box-sizing: border-box;
}

.fs-hero {
    position: relative;
    background: linear-gradient(128deg, #0c4a6e 0%, #134e4a 38%, #0f766e 72%, #115e59 100%);
    overflow: hidden;
}
.fs-hero::before {
    content: "";
    position: absolute;
    top: -40%;
    right: -8%;
    width: 42%;
    height: 140%;
    background: radial-gradient(ellipse, rgba(45, 212, 191, 0.28) 0%, transparent 68%);
    pointer-events: none;
}
.fs-hero::after {
    content: "";
    position: absolute;
    bottom: -30%;
    left: 5%;
    width: 28%;
    height: 80%;
    background: radial-gradient(ellipse, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
    pointer-events: none;
}
.fs-hero > * { position: relative; z-index: 1; }

.fs-hero-icon {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.875rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 1.125rem;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
}

.fs-hero-band {
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(0, 0, 0, 0.12);
    padding: 0.75rem 1.25rem 1rem;
}
.fs-hero-band nav {
    margin-top: 0;
    max-width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
}
.fs-hero-band nav::-webkit-scrollbar { display: none; }
.fs-hero-band .accounts-tab-link {
    margin-top: 0;
    white-space: nowrap;
    flex-shrink: 0;
}
@media (min-width: 640px) {
    .fs-hero-band { padding-left: 1.75rem; padding-right: 1.75rem; }
}
@media (max-width: 639px) {
    .fs-hero > div:first-child {
        padding-left: 1rem;
        padding-right: 1rem;
    }
    .fs-hero-stat {
        flex: 1 1 calc(50% - 0.35rem);
        min-width: 7rem;
    }
}

.fs-hero-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 0.625rem;
}
.fs-hero-stat {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.875rem;
    border-radius: 0.75rem;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    min-width: 0;
}
.fs-hero-stat i {
    font-size: 0.75rem;
    color: #5eead4;
    opacity: 0.9;
}
.fs-hero-stat-label {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: rgba(226, 232, 240, 0.75);
    line-height: 1.2;
}
.fs-hero-stat-value {
    font-size: 0.9375rem;
    font-weight: 700;
    color: #fff;
    font-variant-numeric: tabular-nums;
}

.fs-btn-create {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.625rem 1.125rem;
    border-radius: 0.75rem;
    font-size: 0.8125rem;
    font-weight: 600;
    color: #0f766e;
    background: #fff;
    border: none;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.fs-btn-create:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
}

.fs-toolbar {
    background: var(--fs-surface);
    border: 1px solid var(--fs-line);
    border-radius: var(--fs-radius-lg);
    padding: 0.875rem 1rem;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px -6px rgba(15, 23, 42, 0.08);
    margin-bottom: 1rem;
    max-width: 100%;
    min-width: 0;
}
@media (min-width: 640px) {
    .fs-toolbar { padding: 1rem 1.125rem; margin-bottom: 1.25rem; }
}
.dark .fs-toolbar { box-shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.35); }

.fs-toolbar-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.75rem;
}
@media (min-width: 640px) {
    .fs-toolbar-row {
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 0.75rem 1rem;
    }
}
@media (min-width: 1024px) {
    .fs-toolbar-row {
        grid-template-columns: minmax(12rem, 1fr) auto;
    }
}

.fs-search-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
    max-width: 100%;
}
@media (min-width: 1024px) {
    .fs-search-wrap { max-width: 20rem; }
}
.fs-search-wrap .fs-search-input {
    width: 100%;
    min-height: 2.625rem;
    padding: 0.5rem 0.875rem 0.5rem 2.5rem;
    font-size: 0.875rem;
    border: 1px solid var(--fs-line);
    border-radius: 0.75rem;
    background: #f8fafc;
    color: var(--fs-ink);
    transition: border-color 0.15s, box-shadow 0.15s;
}
.dark .fs-search-wrap .fs-search-input { background: #0f172a; }
.fs-search-wrap .fs-search-input:focus {
    outline: none;
    border-color: var(--fs-teal);
    box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
}
.fs-search-wrap .fs-search-icon {
    position: absolute;
    left: 0.875rem;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 0.8125rem;
    pointer-events: none;
}

.fs-filters {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    width: 100%;
}
@media (min-width: 640px) {
    .fs-filters {
        display: flex;
        flex-wrap: nowrap;
        gap: 0.625rem;
        width: auto;
    }
}
.fs-filter-field {
    min-width: 0;
}
@media (min-width: 640px) {
    .fs-filter-field { min-width: 7rem; }
}
.fs-filter-field label {
    display: block;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--fs-muted);
    margin-bottom: 0.3rem;
}
.fs-filter-field select {
    width: 100%;
    min-height: 2.625rem;
    padding: 0.4rem 2rem 0.4rem 0.65rem;
    font-size: 0.8125rem;
    font-weight: 500;
    border: 1px solid var(--fs-line);
    border-radius: 0.625rem;
    background: #f8fafc;
    color: var(--fs-ink);
}
.dark .fs-filter-field select { background: #0f172a; }
.fs-filter-field select:focus {
    outline: none;
    border-color: var(--fs-teal);
    box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.18);
}

.fs-years {
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--fs-line);
}
.fs-years-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.625rem;
}
.fs-years-label {
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--fs-muted);
    display: flex;
    align-items: center;
    gap: 0.375rem;
}
.fs-years-label i { color: var(--fs-teal-deep); font-size: 0.625rem; }
.fs-clear-link {
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--fs-teal-deep);
    padding: 0.25rem 0.5rem;
    border-radius: 0.375rem;
    transition: background 0.15s;
}
.fs-clear-link:hover { background: rgba(20, 184, 166, 0.1); }
.dark .fs-clear-link { color: #5eead4; }

.fs-year-pill {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.4rem 0.75rem;
    font-size: 0.75rem;
    font-weight: 600;
    border-radius: 9999px;
    border: 1px solid var(--fs-line);
    background: var(--fs-surface);
    color: var(--fs-ink);
    transition: all 0.15s ease;
}
.fs-year-pill:hover {
    border-color: var(--fs-teal);
    background: #f0fdfa;
}
.fs-year-pill.is-active {
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 10px rgba(13, 148, 136, 0.35);
}
.fs-year-pill .fs-pill-dot {
    width: 0.375rem;
    height: 0.375rem;
    border-radius: 50%;
    background: #fbbf24;
    box-shadow: 0 0 0 2px rgba(251, 191, 36, 0.35);
}
.fs-year-pill.is-active .fs-pill-dot {
    background: #fff;
    box-shadow: none;
}

.fs-years-scroll {
    margin: 0 -0.25rem;
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: rgba(13, 148, 136, 0.35) transparent;
}
.fs-years-track {
    display: flex;
    flex-wrap: nowrap;
    gap: 0.5rem;
    padding: 0.125rem 0.25rem 0.25rem;
    width: max-content;
    max-width: 100%;
}
@media (min-width: 768px) {
    .fs-years-scroll { overflow-x: visible; }
    .fs-years-track {
        flex-wrap: wrap;
        width: 100%;
    }
}

.fs-list-card {
    max-width: 100%;
    min-width: 0;
    background: var(--fs-surface);
    border: 1px solid var(--fs-line);
    border-radius: var(--fs-radius-lg);
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px -8px rgba(15, 23, 42, 0.08);
}
.dark .fs-list-card { box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.4); }

.fs-list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.75rem 1rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--fs-line);
    background: linear-gradient(180deg, #f8fafc 0%, var(--fs-surface) 100%);
}
@media (min-width: 640px) {
    .fs-list-head { padding: 0.875rem 1.25rem; gap: 0.75rem; }
}
.dark .fs-list-head {
    background: linear-gradient(180deg, rgba(30, 41, 59, 0.6) 0%, var(--fs-surface) 100%);
}
.fs-list-title {
    min-width: 0;
    flex: 1 1 auto;
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--fs-ink);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
@media (max-width: 639px) {
    .fs-list-title { font-size: 0.8125rem; }
}
.fs-list-title i {
    width: 1.75rem;
    height: 1.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0.5rem;
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: #fff;
    font-size: 0.6875rem;
}
.fs-list-count {
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--fs-muted);
    padding: 0.25rem 0.625rem;
    border-radius: 9999px;
    background: #f1f5f9;
}
.dark .fs-list-count { background: #334155; }

.fs-table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-width: 100%;
}
.fs-table {
    width: 100%;
    min-width: 0;
    border-collapse: collapse;
    font-size: 0.8125rem;
    table-layout: fixed;
}
.fs-col-fee { width: 20%; }
.fs-col-account { width: 14%; }
.fs-col-year-cat { width: 14%; }
.fs-col-level { width: 22%; }
.fs-col-amt { width: 11%; }
.fs-col-status { width: 7%; }
.fs-col-act { width: 10%; }

.fs-table thead th {
    padding: 0.625rem 0.5rem;
    text-align: left;
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--fs-muted);
    background: #f8fafc;
    border-bottom: 1px solid var(--fs-line);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.fs-th-actions { text-align: center; width: 6.5rem; }
.dark .fs-table thead th { background: #1e293b; }
.fs-table tbody td {
    padding: 0.625rem 0.5rem;
    border-bottom: 1px solid var(--fs-line);
    vertical-align: middle;
    overflow: hidden;
}
@media (min-width: 1280px) {
    .fs-table thead th { padding: 0.75rem 0.75rem; }
    .fs-table tbody td { padding: 0.75rem 0.75rem; }
}
@media (min-width: 1536px) {
    .fs-table thead th { padding: 0.75rem 1rem; }
    .fs-table tbody td { padding: 0.875rem 1rem; }
}

.fs-truncate {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
    display: block;
}
.fs-line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
}
.fs-truncate-badge {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: inline-block;
    vertical-align: middle;
}
.fs-td-fee,
.fs-td-account,
.fs-td-year-cat,
.fs-td-levels,
.fs-td-badge { max-width: 0; }
.fs-td-levels { vertical-align: top; }
.fs-levels-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
    max-width: 100%;
    max-height: 4.5rem;
    overflow-y: auto;
    scrollbar-width: thin;
}
.fs-levels-wrap .fs-badge--level {
    max-width: 100%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.fs-mobile-levels {
    margin-bottom: 0.625rem;
    padding: 0.5rem 0.55rem;
    border-radius: 0.5rem;
    background: rgba(59, 130, 246, 0.06);
    border: 1px solid rgba(59, 130, 246, 0.12);
}
.dark .fs-mobile-levels {
    background: rgba(59, 130, 246, 0.1);
    border-color: rgba(59, 130, 246, 0.2);
}
.fs-mobile-levels .fs-levels-wrap {
    margin-top: 0.35rem;
    max-height: none;
}
.fs-td-amt { max-width: 0; white-space: nowrap; }
.fs-td-actions {
    width: 6.5rem;
    max-width: 6.5rem;
    padding-left: 0.25rem !important;
    padding-right: 0.25rem !important;
}
.fs-account-cell {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    color: #0f766e;
    line-height: 1.35;
}
.fs-account-cell.is-empty {
    color: var(--fs-muted);
    font-weight: 500;
    font-style: italic;
}
.dark .fs-account-cell { color: #5eead4; }
.dark .fs-account-cell.is-empty { color: #94a3b8; }
.fs-mobile-account-row {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    margin-bottom: 0.5rem;
    padding: 0.4rem 0.55rem;
    border-radius: 0.5rem;
    background: rgba(20, 184, 166, 0.06);
    border: 1px solid rgba(20, 184, 166, 0.12);
    min-width: 0;
}
.dark .fs-mobile-account-row {
    background: rgba(20, 184, 166, 0.08);
    border-color: rgba(20, 184, 166, 0.2);
}
.fs-mobile-account-label {
    flex-shrink: 0;
    font-size: 0.625rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--fs-muted);
}
.fs-mobile-account-row .fs-account-cell {
    flex: 1;
    min-width: 0;
}
.fs-cell-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.3rem;
    max-width: 100%;
}
.fs-badge--status { min-width: 2rem; justify-content: center; }
.fs-table tbody tr:last-child td { border-bottom: none; }
.fs-table tbody tr {
    transition: background 0.12s ease;
}
.fs-table tbody tr:hover {
    background: rgba(20, 184, 166, 0.04);
}
.dark .fs-table tbody tr:hover {
    background: rgba(20, 184, 166, 0.08);
}

.fs-fee-name {
    font-weight: 700;
    color: var(--fs-ink);
    line-height: 1.3;
}
.fs-fee-meta {
    font-size: 0.625rem;
    color: var(--fs-muted);
    margin-top: 0.2rem;
}

.fs-badge {
    display: inline-flex;
    align-items: center;
    padding: 0.15rem 0.45rem;
    font-size: 0.625rem;
    font-weight: 600;
    border-radius: 9999px;
    white-space: nowrap;
    max-width: 100%;
}
@media (min-width: 1280px) {
    .fs-badge {
        padding: 0.2rem 0.55rem;
        font-size: 0.6875rem;
    }
}
.fs-badge--level {
    background: rgba(59, 130, 246, 0.12);
    color: #1d4ed8;
}
.dark .fs-badge--level { color: #93c5fd; }
.fs-badge--year {
    background: rgba(20, 184, 166, 0.12);
    color: #0f766e;
}
.dark .fs-badge--year { color: #5eead4; }
.fs-badge--both {
    background: rgba(139, 92, 246, 0.12);
    color: #6d28d9;
}
.dark .fs-badge--both { color: #c4b5fd; }
.fs-badge--self {
    background: rgba(34, 197, 94, 0.12);
    color: #15803d;
}
.dark .fs-badge--self { color: #86efac; }
.fs-badge--sponsored {
    background: rgba(249, 115, 22, 0.12);
    color: #c2410c;
}
.dark .fs-badge--sponsored { color: #fdba74; }
.fs-badge--neutral {
    background: #f1f5f9;
    color: #475569;
}
.dark .fs-badge--neutral { background: #334155; color: #cbd5e1; }
.fs-badge--active {
    background: rgba(34, 197, 94, 0.12);
    color: #15803d;
}
.dark .fs-badge--active { color: #86efac; }
.fs-badge--inactive {
    background: #f1f5f9;
    color: #64748b;
}
.dark .fs-badge--inactive { background: #334155; }

.fs-amount {
    font-weight: 800;
    font-size: 0.75rem;
    color: #0f766e;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
    max-width: 100%;
}
@media (min-width: 1280px) {
    .fs-amount { font-size: 0.875rem; }
}
.dark .fs-amount { color: #5eead4; }

.fs-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.2rem;
    flex-wrap: nowrap;
}
.fs-action {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.875rem;
    height: 1.875rem;
    font-size: 0.75rem;
    flex-shrink: 0;
    border-radius: 0.5rem;
    border: 1px solid transparent;
    transition: background 0.12s, transform 0.12s;
}
@media (min-width: 1280px) {
    .fs-action {
        width: 2.125rem;
        height: 2.125rem;
        font-size: 0.8125rem;
    }
}
.fs-action:hover { transform: translateY(-1px); }
.fs-action--view {
    color: #0369a1;
    background: #f0f9ff;
    border-color: #bae6fd;
}
.dark .fs-action--view { color: #7dd3fc; background: rgba(14, 165, 233, 0.12); border-color: transparent; }
.fs-action--edit {
    color: #0d9488;
    background: #f0fdfa;
    border-color: #99f6e4;
}
.dark .fs-action--edit { color: #5eead4; background: rgba(20, 184, 166, 0.12); border-color: transparent; }
.fs-action--delete {
    color: #be123c;
    background: #fff1f2;
    border-color: #fecdd3;
}
.dark .fs-action--delete { color: #fb7185; background: rgba(244, 63, 94, 0.12); border-color: transparent; }

.fs-empty {
    padding: 3rem 1.5rem;
    text-align: center;
}
.fs-empty--solo {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 12rem;
    border-top: 1px solid var(--fs-line);
}
.fs-empty-icon {
    width: 3.5rem;
    height: 3.5rem;
    margin: 0 auto 1rem;
    border-radius: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(20, 184, 166, 0.15), rgba(13, 148, 136, 0.08));
    color: var(--fs-teal-deep);
    font-size: 1.25rem;
}
.fs-empty h3 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--fs-ink);
    margin: 0 0 0.35rem;
}
.fs-empty p {
    font-size: 0.8125rem;
    color: var(--fs-muted);
    margin: 0;
}

/* Mobile & tablet cards (< lg) */
.fs-mobile-list--cards {
    padding: 0.75rem;
    display: flex;
