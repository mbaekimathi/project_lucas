{% set fo = filter_options|default({}) %}
<section class="fr-report-panel no-print" aria-label="Report filters">
    <div class="fr-report-panel__head">
        <h2 class="fr-report-panel__title"><span id="fr-filter-title">Filters</span> <span class="fr-filters-live-hint">· updates automatically</span></h2>
        <div class="fr-report-filters__actions">
            <button type="button" id="fr-reset" class="fr-btn fr-btn--ghost">
                <span>Reset</span>
            </button>
        </div>
    </div>
    <div class="fr-report-filters">
        <p id="fr-filter-context" class="fr-filter-context" role="note"></p>
        <div id="fr-filter-grid" class="fr-report-filters__grid">
            <div class="fr-filter-group hidden" data-fr-group="financial_year" id="fr-financial-year-wrap">
                <p class="fr-filter-group__label">Financial year</p>
                <div class="fr-report-field">
                    <label for="fr-financial-year" class="sr-only">Financial year</label>
                    <select id="fr-financial-year">
                        {% for fy in fo.financial_years|default([]) %}
                        <option value="{{ fy.id }}"
                                data-start="{{ fy.start }}"
                                data-end="{{ fy.end }}"
                                data-is-current="{{ '1' if fy.is_current else '0' }}"
                                {% if fo.default_financial_year_id|default(none) == fy.id %}selected{% endif %}>
                            {{ fy.label }}{% if fy.is_current %} (current){% endif %}{% if fy.is_locked %} · closed{% endif %}
                            — {{ fy.start_display }} – {{ fy.end_display }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <p id="fr-fy-range-hint" class="fr-filter-fy-hint" aria-live="polite"></p>
            </div>
            <div class="fr-filter-group fr-filter-group--date" data-fr-group="date">
                <p class="fr-filter-group__label">Date range</p>
                <div class="fr-filter-group__row">
                    <div class="fr-report-field">
                        <label for="fr-date-from">From</label>
                        <input type="date" id="fr-date-from" value="{{ fo.default_date_from|default('') }}" />
                    </div>
                    <div class="fr-report-field">
                        <label for="fr-date-to">To</label>
                        <input type="date" id="fr-date-to" value="{{ fo.default_date_to|default('') }}" />
                    </div>
                </div>
            </div>
            <div class="fr-filter-group hidden" data-fr-group="period" id="fr-period-wrap">
                <p class="fr-filter-group__label">Roll up by</p>
                <div class="fr-report-field">
                    <label for="fr-period" class="sr-only">Group by</label>
                    <select id="fr-period">
                        <option value="daily">Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly" selected>Monthly</option>
                        <option value="term">By term</option>
                    </select>
                </div>
            </div>
            <div class="fr-filter-group hidden" data-fr-group="source" id="fr-source-wrap">
                <p class="fr-filter-group__label" id="fr-source-group-label">Type</p>
                <div class="fr-report-field">
                    <label for="fr-source" class="sr-only">Type</label>
                    <select id="fr-source">
                        <option value="all">All</option>
                    </select>
                </div>
            </div>
            <div class="fr-filter-group hidden" data-fr-group="account">
                <p class="fr-filter-group__label">Finance account</p>
                <div class="fr-report-field">
                    <label for="fr-finance-account" class="sr-only">Finance account</label>
                    <select id="fr-finance-account">
                        <option value="">All accounts</option>
                        {% for a in fo.finance_accounts|default([]) %}
                        <option value="{{ a.id }}">{{ a.name }}{% if a.category %} ({{ a.category }}){% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="fr-filter-group hidden" data-fr-group="class">
                <p class="fr-filter-group__label">Class / level</p>
                <div class="fr-report-field">
                    <label for="fr-grade" class="sr-only">Class</label>
                    <select id="fr-grade">
                        <option value="">All classes</option>
                        {% for lv in fo.class_options|default([]) %}
                        <option value="{{ lv|e }}">{{ lv }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="fr-filter-group hidden fr-filter-group--wide" data-fr-group="search">
                <p class="fr-filter-group__label">Quick search</p>
                <div class="fr-report-field">
                    <label for="fr-search" class="sr-only">Search</label>
                    <input type="search" id="fr-search" placeholder="Search in results…" autocomplete="off" />
                </div>
            </div>
        </div>
        <p id="fr-active-filters" class="fr-active-filters hidden" aria-live="polite"></p>
    </div>
</section>
