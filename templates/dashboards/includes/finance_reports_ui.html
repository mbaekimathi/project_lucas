<style>
/* Accounts reports — modern, responsive UI */
.fr-report-shell {
    --fr-bg: #eef2f6;
    --fr-surface: #ffffff;
    --fr-surface-2: #f8fafc;
    --fr-ink: #0f172a;
    --fr-muted: #64748b;
    --fr-line: #e2e8f0;
    --fr-teal: #0d9488;
    --fr-teal-soft: rgba(13, 148, 136, 0.1);
    --fr-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px -6px rgba(15, 23, 42, 0.08);
    --fr-radius: 12px;
    --fr-radius-sm: 8px;
    min-height: 100%;
    padding: clamp(0.75rem, 2vw, 1.5rem);
    padding-bottom: 2rem;
    color: var(--fr-ink);
    background: var(--fr-bg);
}
.dark .fr-report-shell {
    --fr-bg: #0b1120;
    --fr-surface: #111827;
    --fr-surface-2: #1e293b;
    --fr-ink: #f1f5f9;
    --fr-muted: #94a3b8;
    --fr-line: #334155;
    --fr-teal-soft: rgba(20, 184, 166, 0.15);
    --fr-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 12px 32px -8px rgba(0, 0, 0, 0.45);
}
.fr-report-shell .fr-inner {
    max-width: 76rem;
    margin: 0 auto;
    width: 100%;
}

/* Toolbar */
.fr-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1rem;
}
.fr-breadcrumb {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.75rem;
    color: var(--fr-muted);
}
.fr-breadcrumb a {
    color: var(--fr-teal);
    text-decoration: none;
    font-weight: 500;
}
.fr-breadcrumb a:hover { text-decoration: underline; }
.fr-breadcrumb__current {
    color: var(--fr-ink);
    font-weight: 600;
    max-width: 14rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.fr-toolbar__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}

/* Report masthead */
.fr-masthead {
    background: var(--fr-surface);
    border: 1px solid var(--fr-line);
    border-radius: var(--fr-radius);
    box-shadow: var(--fr-shadow);
    overflow: hidden;
    margin-bottom: 1.25rem;
}
.fr-masthead__band {
    background: linear-gradient(135deg, #0f766e 0%, #115e59 50%, #134e4a 100%);
    color: #fff;
    padding: 1.25rem clamp(1rem, 3vw, 1.75rem);
    position: relative;
}
.fr-masthead__band::after {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: 0.5;
    pointer-events: none;
}
.fr-masthead__inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 1rem 1.5rem;
    align-items: flex-start;
    justify-content: space-between;
}
.fr-masthead__school {
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    opacity: 0.85;
    margin: 0 0 0.35rem;
}
.fr-masthead__title {
    font-size: clamp(1.25rem, 3.5vw, 1.625rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin: 0;
}
.fr-masthead__subtitle {
    font-size: 0.9375rem;
    opacity: 0.92;
    margin: 0.35rem 0 0;
    font-weight: 500;
}
.fr-masthead__meta {
    text-align: left;
    font-size: 0.75rem;
    opacity: 0.92;
    line-height: 1.55;
}
@media (min-width: 640px) {
    .fr-masthead__meta { text-align: right; min-width: 11rem; }
}
.fr-masthead__doc-type {
    margin-top: 0.35rem;
    font-size: 0.625rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.75;
}
.fr-masthead__body {
    padding: 0.875rem clamp(1rem, 3vw, 1.5rem);
    border-top: 1px solid var(--fr-line);
}
.fr-masthead__desc {
    margin: 0;
    font-size: 0.875rem;
    line-height: 1.5;
    color: var(--fr-muted);
}

/* Page header */
.fr-report-header {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 0.875rem 1rem;
    margin-bottom: 1rem;
    padding: 1rem 1.125rem;
    background: var(--fr-surface);
    border: 1px solid var(--fr-line);
    border-radius: var(--fr-radius);
    box-shadow: var(--fr-shadow);
    border-left: 4px solid var(--fr-teal);
}
.fr-report-header__icon {
    flex-shrink: 0;
    width: 2.75rem;
    height: 2.75rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--fr-radius-sm);
    background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
    color: #fff;
    font-size: 1.125rem;
    box-shadow: 0 4px 12px rgba(13, 148, 136, 0.35);
}
.fr-report-header__body { min-width: 0; flex: 1; }
.fr-report-header__eyebrow {
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fr-teal);
    margin: 0 0 0.25rem;
}
.fr-report-header__title {
    font-size: clamp(1.125rem, 2.5vw, 1.375rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.25;
    margin: 0;
    color: var(--fr-ink);
}
.fr-report-header__desc {
    margin: 0.375rem 0 0;
    font-size: 0.8125rem;
    line-height: 1.45;
    color: var(--fr-muted);
    max-width: 42rem;
}

/* Panels */
.fr-report-panel {
    background: var(--fr-surface);
    border: 1px solid var(--fr-line);
    border-radius: var(--fr-radius);
    box-shadow: var(--fr-shadow);
    margin-bottom: 1rem;
    overflow: hidden;
}
.fr-report-panel__head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem 0.75rem;
    padding: 0.625rem 1rem;
    background: var(--fr-surface-2);
    border-bottom: 1px solid var(--fr-line);
}
.fr-report-panel__title {
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fr-muted);
    margin: 0;
}
.fr-filters-live-hint {
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    color: var(--fr-teal);
    opacity: 0.9;
}
.fr-report-panel__toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border-bottom: 1px solid var(--fr-line);
    font-size: 0.75rem;
    color: var(--fr-muted);
}
.fr-report-panel__body { padding: 0; }

/* Filters */
.fr-report-filters { padding: 0.875rem 1rem 1rem; }
.fr-filter-context {
    margin: 0 0 0.75rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.8125rem;
    line-height: 1.45;
    color: var(--fr-ink);
    background: var(--fr-teal-soft);
    border-radius: var(--fr-radius-sm);
    border-left: 3px solid var(--fr-teal);
}
.fr-filter-group {
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--fr-line);
}
.fr-filter-group:last-child { border-bottom: none; }
.fr-filter-group.hidden { display: none !important; }
.fr-filter-group__label {
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--fr-muted);
    margin: 0 0 0.375rem;
}
.fr-filter-group__row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
}
@media (min-width: 640px) {
    .fr-report-filters__grid--active {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0 1rem;
    }
    .fr-report-filters__grid--active .fr-filter-group--wide {
        grid-column: 1 / -1;
    }
    .fr-report-filters__grid--active .fr-filter-group--date {
        grid-column: 1 / -1;
    }
}
.fr-active-filters {
    margin: 0.625rem 0 0;
    font-size: 0.75rem;
    color: var(--fr-muted);
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    align-items: center;
}
.fr-active-filters.hidden { display: none !important; }
.fr-active-filters__chip {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.15rem 0.5rem;
    font-size: 0.6875rem;
    font-weight: 600;
    color: var(--fr-teal);
    background: var(--fr-teal-soft);
    border-radius: 9999px;
}
.fr-report-filters--minimal .fr-report-filters__grid { display: none; }
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}
.fr-report-filters__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.375rem;
}
.fr-report-filters__grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.625rem 0.75rem;
    margin-top: 0.75rem;
}
@media (min-width: 480px) {
    .fr-report-filters__grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 768px) {
    .fr-report-filters__grid { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 1024px) {
    .fr-report-filters__grid { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 1280px) {
    .fr-report-filters__grid { grid-template-columns: repeat(5, 1fr); }
}
.fr-report-field label {
    display: block;
    font-size: 0.6875rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--fr-muted);
    margin-bottom: 0.25rem;
}
.fr-report-field input,
.fr-report-field select {
    width: 100%;
    min-height: 2.25rem;
    padding: 0.375rem 0.625rem;
    font-size: 0.8125rem;
    line-height: 1.3;
    color: var(--fr-ink);
    background: var(--fr-surface);
    border: 1px solid var(--fr-line);
    border-radius: var(--fr-radius-sm);
    transition: border-color 0.15s, box-shadow 0.15s;
}
.fr-report-field input:focus,
.fr-report-field select:focus {
    outline: none;
    border-color: var(--fr-teal);
    box-shadow: 0 0 0 3px var(--fr-teal-soft);
}
.fr-filter-fy-hint {
    margin-top: 0.375rem;
    font-size: 0.6875rem;
    color: var(--fr-muted);
    line-height: 1.35;
}
.fr-report-field--wide { grid-column: 1 / -1; }
@media (min-width: 768px) {
    .fr-report-field--wide { grid-column: span 2; }
}
.fr-report-hint {
    margin: 0.625rem 0 0;
    padding: 0.5rem 0.75rem;
    font-size: 0.75rem;
    line-height: 1.4;
    color: var(--fr-muted);
    background: var(--fr-teal-soft);
    border-radius: var(--fr-radius-sm);
    border-left: 3px solid var(--fr-teal);
}

/* Buttons */
.fr-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    min-height: 2.25rem;
    padding: 0.375rem 0.875rem;
    font-size: 0.8125rem;
    font-weight: 600;
    border-radius: var(--fr-radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
}
.fr-btn:active { transform: scale(0.98); }
.fr-btn--primary {
    background: linear-gradient(135deg, #0f766e, #0d9488);
    color: #fff;
    box-shadow: 0 2px 8px rgba(13, 148, 136, 0.35);
}
.fr-btn--primary:hover { filter: brightness(1.05); }
.fr-btn--ghost {
    background: var(--fr-surface);
    color: var(--fr-ink);
    border-color: var(--fr-line);
}
.fr-btn--ghost:hover { background: var(--fr-surface-2); }
.fr-btn--text {
    background: transparent;
    color: var(--fr-teal);
    min-height: auto;
    padding: 0.25rem 0.5rem;
}
.fr-btn--text:hover { text-decoration: underline; }

/* KPI cards */
.fr-report-kpis {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.625rem;
    margin-bottom: 1rem;
}
@media (min-width: 640px) {
    .fr-report-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (min-width: 1024px) {
    .fr-report-kpis { grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); }
}
.fr-kpi {
    position: relative;
    padding: 0.75rem 0.875rem;
    background: var(--fr-surface);
    border: 1px solid var(--fr-line);
    border-radius: var(--fr-radius-sm);
    box-shadow: var(--fr-shadow);
    overflow: hidden;
}
.fr-kpi::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--fr-kpi-accent, var(--fr-teal));
}
.fr-kpi__label {
    font-size: 0.625rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--fr-muted);
    margin: 0;
    line-height: 1.3;
}
.fr-kpi__value {
    margin: 0.25rem 0 0;
    font-size: clamp(0.875rem, 2vw, 1rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fr-ink);
    line-height: 1.2;
    word-break: break-word;
}
.fr-kpi__hint {
    margin: 0.125rem 0 0;
    font-size: 0.625rem;
    color: var(--fr-muted);
}
.fr-kpi--teal { --fr-kpi-accent: #0d9488; }
.fr-kpi--emerald { --fr-kpi-accent: #059669; }
.fr-kpi--amber { --fr-kpi-accent: #d97706; }
.fr-kpi--violet { --fr-kpi-accent: #7c3aed; }
.fr-kpi--sky { --fr-kpi-accent: #0284c7; }

/* Vote detail — budget, expenditure, balance */
.fr-vote-detail {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1rem;
}
.fr-vote-kpis {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.75rem;
}
@media (max-width: 767px) {
    .fr-vote-kpis { grid-template-columns: 1fr; }
}
.fr-vote-kpi {
    background: var(--fr-surface);
    border: 1px solid var(--fr-line);
    border-radius: var(--fr-radius);
    padding: 1rem 1.125rem;
    box-shadow: var(--fr-shadow);
    border-top: 3px solid var(--fr-vote-accent, var(--fr-teal));
}
.fr-vote-kpi--budget { --fr-vote-accent: #0284c7; }
.fr-vote-kpi--expenditure { --fr-vote-accent: #d97706; }
.fr-vote-kpi--balance { --fr-vote-accent: #059669; }
.fr-vote-kpi__label {
    margin: 0;
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--fr-muted);
}
.fr-vote-kpi__value {
    margin: 0.35rem 0 0;
    font-size: 1.375rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fr-ink);
    line-height: 1.2;
}
.fr-vote-kpi__hint {
    margin: 0.35rem 0 0;
    font-size: 0.6875rem;
    color: var(--fr-muted);
}
/* Vote ledger — opening, totals and closing rows */
.fr-ledger-row td {
    font-weight: 600;
    background: var(--fr-surface-2);
    border-top: 1px solid var(--fr-line);
}
.fr-ledger-row--opening td {
    color: var(--fr-ink);
}
.fr-ledger-row--total td {
    color: #0284c7;
}
.fr-ledger-row--closing td {
    color: #059669;
}
.fr-ledger-row--section td {
    font-weight: 700;
    font-size: 0.6875rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--fr-teal);
    background: rgba(13, 148, 136, 0.06);
    border-top: 1px solid var(--fr-line);
    border-bottom: 1px solid var(--fr-line);
}
.fr-vote-compare {
    background: var(--fr-surface);
    border: 1px solid var(--fr-line);
    border-radius: var(--fr-radius);
    padding: 1rem 1.125rem;
    box-shadow: var(--fr-shadow);
}
.fr-vote-compare__head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
}
.fr-vote-compare__title {
    margin: 0;
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--fr-ink);
}
.fr-vote-compare__util {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--fr-teal);
    background: var(--fr-teal-soft);
    padding: 0.2rem 0.55rem;
    border-radius: 999px;
}
.fr-vote-compare__bar-wrap {
    height: 0.5rem;
    background: var(--fr-surface-2);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 1rem;
    border: 1px solid var(--fr-line);
}
.fr-vote-compare__bar {
    height: 100%;
    background: linear-gradient(90deg, #0d9488, #0284c7);
    border-radius: 999px;
    min-width: 0;
    transition: width 0.35s ease;
}
.fr-vote-compare__grid {
    display: grid;
    gap: 0.5rem;
}
.fr-vote-compare__row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    padding: 0.45rem 0;
    border-bottom: 1px dashed var(--fr-line);
    font-size: 0.8125rem;
}
.fr-vote-compare__row:last-child { border-bottom: none; }
.fr-vote-compare__row--total {
    font-weight: 700;
    padding-top: 0.65rem;
    border-top: 2px solid var(--fr-line);
    border-bottom: none;
}
.fr-vote-compare__label { color: var(--fr-muted); }
.fr-vote-compare__value {
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    color: var(--fr-ink);
}
.fr-vote-compare__value--in { color: #047857; }
.fr-vote-compare__value--out { color: #b45309; }
.dark .fr-vote-compare__value--in { color: #34d399; }
.dark .fr-vote-compare__value--out { color: #fbbf24; }

/* Table — paper grid (rows + columns) */
.fr-report-table-scroll {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    max-height: min(58vh, 560px);
    background: #fffef9;
    border: 1px solid #a8b4c0;
    border-radius: var(--fr-radius-sm);
}
.dark .fr-report-table-scroll {
    background: var(--fr-surface);
    border-color: #475569;
}
.fr-report-table-scroll--stack { max-height: min(58vh, 560px); min-height: 12rem; }
.fr-report-panel__body .fr-report-table-scroll { max-height: min(58vh, 560px); }
.fr-report-table-scroll::after {
    content: '';
    display: block;
    height: 0;
}
@media (max-width: 767px) {
    .fr-report-scroll-hint {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.375rem 1rem;
        font-size: 0.6875rem;
        color: var(--fr-muted);
        background: var(--fr-surface-2);
        border-bottom: 1px solid var(--fr-line);
    }
}
@media (min-width: 768px) {
    .fr-report-scroll-hint { display: none; }
}
.fr-report-table {
    width: 100%;
    min-width: 36rem;
    border-collapse: collapse;
    font-size: 0.8125rem;
    --fr-grid: #a8b4c0;
    background: #fffef9;
}
.dark .fr-report-table {
    --fr-grid: #475569;
    background: var(--fr-surface);
}
.fr-report-table thead {
    position: sticky;
    top: 0;
    z-index: 1;
}
.fr-report-table th {
    padding: 0.625rem 0.75rem;
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--fr-ink);
    text-align: left;
    border: 1px solid var(--fr-grid);
    background: #f1f5f9;
    white-space: nowrap;
}
.dark .fr-report-table th {
    background: #1e293b;
}
.fr-report-table th.text-right,
.fr-report-table td.text-right { text-align: right; }
.fr-report-table td {
    padding: 0.625rem 0.75rem;
    border: 1px solid var(--fr-grid);
    color: var(--fr-ink);
    vertical-align: middle;
