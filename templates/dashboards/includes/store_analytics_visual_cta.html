<div class="sinv-visual-cta" role="note" aria-label="Visual analytics available">
    <div class="sinv-visual-cta__icon" aria-hidden="true">
        <i class="fas fa-chart-pie"></i>
    </div>
    <div class="sinv-visual-cta__body">
        <p class="sinv-visual-cta__title">See trends and charts for this period</p>
        <p class="sinv-visual-cta__hint">Usage trends, stock in vs out, purpose breakdowns, and item activity — all in one visual dashboard.</p>
    </div>
    <button type="button" @click="setViewTab('visual')" class="sinv-visual-cta__btn">
        <i class="fas fa-chart-line" aria-hidden="true"></i>
        View visual analytics
    </button>
</div>
