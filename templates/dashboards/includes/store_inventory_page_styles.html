<style>
.si-page {
    --si-bg: #ffffff;
    --si-surface: #f8fafc;
    --si-line: #e2e8f0;
    --si-ink: #0f172a;
    --si-muted: #64748b;
    --si-brand: var(--brand-primary, #2563eb);
    --si-brand-soft: color-mix(in srgb, var(--si-brand) 12%, transparent);
    --si-radius: 0.75rem;
    --si-shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 4px 16px rgba(15, 23, 42, 0.04);
}
.dark .si-page {
    --si-bg: #0f172a;
    --si-surface: #1e293b;
    --si-line: #334155;
    --si-ink: #f1f5f9;
    --si-muted: #94a3b8;
    --si-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
}
.si-page .si-panel {
    background: var(--si-bg);
    border: 1px solid var(--si-line);
    border-radius: var(--si-radius);
    box-shadow: var(--si-shadow);
}
.si-page .si-panel-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem 1rem;
    padding: 1rem 1.125rem;
    border-bottom: 1px solid var(--si-line);
}
.si-page .si-panel-body { padding: 1rem 1.125rem; }
@media (min-width: 640px) {
    .si-page .si-panel-head, .si-page .si-panel-body { padding: 1.125rem 1.25rem; }
}
.si-page .si-title {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--si-ink);
    letter-spacing: -0.01em;
}
.si-page .si-subtitle {
    font-size: 0.8125rem;
    color: var(--si-muted);
    line-height: 1.45;
    margin-top: 0.2rem;
}
.si-page .si-input,
.si-page .si-select,
.si-page .si-textarea {
    width: 100%;
    border-radius: 0.5rem;
    border: 1px solid var(--si-line);
    background: var(--si-bg);
    color: var(--si-ink);
    font-size: 0.8125rem;
    padding: 0.5rem 0.75rem;
    transition: border-color 0.15s, box-shadow 0.15s;
}
.si-page .si-input:focus,
.si-page .si-select:focus,
.si-page .si-textarea:focus {
    outline: none;
    border-color: var(--si-brand);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--si-brand) 18%, transparent);
}
.si-page .si-label {
    display: block;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--si-muted);
    margin-bottom: 0.35rem;
}
.si-page .si-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.375rem;
    border-radius: 0.5rem;
    font-size: 0.8125rem;
    font-weight: 600;
    padding: 0.5rem 1rem;
    transition: opacity 0.15s, filter 0.15s;
}
.si-page .si-btn:disabled { opacity: 0.55; cursor: not-allowed; }
.si-page .si-btn--brand { background: var(--si-brand); color: #fff; }
.si-page .si-btn--brand:hover:not(:disabled) { filter: brightness(1.05); }
.si-page .si-btn--ghost {
    background: transparent;
    border: 1px solid var(--si-line);
    color: var(--si-ink);
}
.si-page .si-btn--ghost:hover:not(:disabled) { background: var(--si-surface); }
.si-page .si-btn--icon {
    width: 2.25rem;
    height: 2.25rem;
    padding: 0;
    border-radius: 0.5rem;
    border: 1px solid var(--si-line);
    background: var(--si-bg);
    color: var(--si-muted);
}
.si-page .si-btn--icon:hover { background: var(--si-surface); color: var(--si-ink); }
.si-page .si-btn--icon.is-edit { color: #0284c7; border-color: #bae6fd; }
.si-page .si-btn--icon.is-warn { color: #b45309; border-color: #fde68a; background: #fffbeb; }
.si-page .si-btn--icon.is-del { color: #dc2626; border-color: #fecaca; background: #fef2f2; }
.si-page .si-btn--icon.is-stock { color: #047857; border-color: #a7f3d0; background: #ecfdf5; }
.si-page .si-btn--icon.is-stock:hover { background: #d1fae5; color: #065f46; }
.si-page .si-btn--stock {
    color: #047857;
    border: 1px solid #a7f3d0;
    background: #ecfdf5;
    padding: 0.375rem 0.625rem;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    white-space: nowrap;
}
.si-page .si-btn--stock:hover { background: #d1fae5; color: #065f46; }
.si-page .si-btn--stock i { font-size: 0.75rem; }
.dark .si-page .si-btn--icon.is-stock,
.dark .si-page .si-btn--stock { background: rgba(4,120,87,0.15); border-color: rgba(167,243,208,0.3); color: #6ee7b7; }
.dark .si-page .si-btn--stock:hover { background: rgba(4,120,87,0.25); color: #a7f3d0; }
.dark .si-page .si-btn--icon.is-warn { background: rgba(180,83,9,0.15); }
.dark .si-page .si-btn--icon.is-del { background: rgba(220,38,38,0.12); }
.si-page .si-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 0.6875rem;
    font-weight: 600;
    padding: 0.2rem 0.5rem;
    border-radius: 9999px;
    white-space: nowrap;
}
.si-page .si-badge--brand { background: var(--si-brand-soft); color: var(--si-brand); }
.si-page .si-badge--warn { background: #fffbeb; color: #b45309; }
.dark .si-page .si-badge--warn { background: rgba(180,83,9,0.2); color: #fcd34d; }
.si-page .si-badge--muted { background: var(--si-surface); color: var(--si-muted); border: 1px solid var(--si-line); }
.si-page .si-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
}
.si-page .si-search-wrap {
    position: relative;
    flex: 1 1 12rem;
    min-width: 0;
    max-width: 24rem;
}
.si-page .si-search-wrap i {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--si-muted);
    font-size: 0.75rem;
    pointer-events: none;
}
.si-page .si-search-wrap .si-input { padding-left: 2.25rem; }
.si-page .si-table-wrap {
    overflow-x: auto;
    border: 1px solid var(--si-line);
    border-radius: 0.625rem;
    -webkit-overflow-scrolling: touch;
}
.si-page .si-table {
    width: 100%;
    min-width: 40rem;
    border-collapse: collapse;
    font-size: 0.8125rem;
}
.si-page .si-table thead {
    background: var(--si-surface);
    border-bottom: 1px solid var(--si-line);
}
.si-page .si-table th {
    text-align: left;
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--si-muted);
    padding: 0.5rem 0.75rem;
    white-space: nowrap;
}
.si-page .si-table td {
    padding: 0.625rem 0.75rem;
    vertical-align: middle;
    border-top: 1px solid var(--si-line);
    color: var(--si-ink);
}
.si-page .si-table tbody tr:hover { background: color-mix(in srgb, var(--si-brand) 4%, transparent); }
.si-page .si-table tr.is-suspended { opacity: 0.72; }
.si-page .si-item-cell {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    min-width: 0;
}
.si-page .si-thumb {
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 0.5rem;
    object-fit: cover;
    border: 1px solid var(--si-line);
    flex-shrink: 0;
}
.si-page .si-thumb--empty {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--si-surface);
    color: var(--si-muted);
    font-size: 0.875rem;
}
.si-page .si-ref {
    font-family: ui-monospace, monospace;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--si-brand);
}
.si-page .si-cards { display: none; }
.si-page .si-table-desktop { display: block; }
.sinv-page .sinv-list-table {
    display: block;
    overflow-x: auto;
}
.sinv-page .sinv-page-stack {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
}
.si-page .si-card {
    border: 1px solid var(--si-line);
    border-radius: 0.625rem;
    padding: 0.75rem;
    background: var(--si-surface);
}
.si-page .si-card.is-suspended { opacity: 0.75; }
.si-page .si-card-top {
    display: flex;
    gap: 0.625rem;
    align-items: flex-start;
    margin-bottom: 0.5rem;
}
.si-page .si-card-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.35rem 0.75rem;
    font-size: 0.75rem;
    color: var(--si-muted);
    margin-bottom: 0.625rem;
}
.si-page .si-card-meta dt { font-weight: 600; font-size: 0.625rem; text-transform: uppercase; letter-spacing: 0.04em; }
.si-page .si-card-meta .si-meta-full { grid-column: 1 / -1; }
.si-page .si-card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.375rem;
    padding-top: 0.5rem;
    border-top: 1px solid var(--si-line);
}
.si-page .si-empty {
    text-align: center;
    padding: 2.5rem 1rem;
    border: 1px dashed var(--si-line);
    border-radius: 0.625rem;
    color: var(--si-muted);
}
.si-page .si-empty i { font-size: 1.75rem; color: var(--si-brand); opacity: 0.7; margin-bottom: 0.75rem; }
.si-page .si-pagination {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-top: 0.75rem;
    font-size: 0.75rem;
    color: var(--si-muted);
}
.si-page .si-form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.875rem;
}
@media (min-width: 640px) {
    .si-page .si-form-grid { grid-template-columns: 1fr 1fr; }
    .si-page .si-form-grid .si-span-2 { grid-column: 1 / -1; }
}
.si-page .si-upper { text-transform: uppercase; }
.si-page .si-normal { text-transform: none; }
.si-page .si-stock-qty {
    display: inline-flex;
    align-items: baseline;
    gap: 0.25rem;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    white-space: nowrap;
}
.si-page .si-stock-qty .si-stock-num { font-size: 0.875rem; color: var(--si-ink); }
.si-page .si-stock-qty .si-stock-unit { font-size: 0.625rem; font-weight: 600; color: var(--si-muted); text-transform: uppercase; }
.si-page .si-stock-qty.is-zero .si-stock-num { color: var(--si-muted); }
.si-page .si-stock-qty.is-low .si-stock-num { color: #b45309; }
.si-page .si-stock-qty.is-ok .si-stock-num { color: #047857; }
.dark .si-page .si-stock-qty.is-low .si-stock-num { color: #fcd34d; }
.dark .si-page .si-stock-qty.is-ok .si-stock-num { color: #6ee7b7; }

/* —— Store inventory page —— */
.si-page.sinv-page {
    --sinv-hero-from: #1e3a5f;
    --sinv-hero-mid: #1e40af;
    --sinv-hero-to: #2563eb;
    --sinv-accent: #2563eb;
    --sinv-accent-soft: #eff6ff;
    --sinv-accent-line: #bfdbfe;
    --sinv-warn: #b45309;
    --sinv-warn-soft: #fffbeb;
    --sinv-ok: #047857;
    --sinv-ok-soft: #ecfdf5;
}

.sinv-page .sinv-hero {
    position: relative;
    margin-bottom: 1.25rem;
    border-radius: 1rem;
    overflow: hidden;
    background: linear-gradient(128deg, var(--sinv-hero-from) 0%, var(--sinv-hero-mid) 45%, var(--sinv-hero-to) 100%);
    box-shadow: 0 10px 40px rgba(37, 99, 235, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
}
.sinv-page .sinv-hero::before {
    content: "";
    position: absolute;
    top: -30%;
    right: -5%;
    width: 40%;
    height: 130%;
    background: radial-gradient(ellipse, rgba(147, 197, 253, 0.35) 0%, transparent 68%);
    pointer-events: none;
}
.sinv-page .sinv-hero__inner {
    position: relative;
    z-index: 1;
    padding: 1.25rem 1.35rem 1.35rem;
}
@media (min-width: 640px) {
    .sinv-page .sinv-hero__inner { padding: 1.5rem 1.75rem 1.65rem; }
}
.sinv-page .sinv-hero__top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 1rem;
}
.sinv-page .sinv-hero__back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.72);
    margin-bottom: 0.5rem;
    transition: color 0.15s;
}
.sinv-page .sinv-hero__back:hover { color: #fff; }
.sinv-page .sinv-hero__icon {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.875rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 1.125rem;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.sinv-page .sinv-hero__title {
    font-size: 1.375rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
    line-height: 1.2;
}
@media (min-width: 640px) { .sinv-page .sinv-hero__title { font-size: 1.625rem; } }
.sinv-page .sinv-hero__sub {
    margin-top: 0.45rem;
    max-width: 38rem;
    font-size: 0.8125rem;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.78);
}
.sinv-page .sinv-hero__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
}
.sinv-page .sinv-hero__link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.16);
    transition: background 0.15s;
}
.sinv-page .sinv-hero__link:hover { background: rgba(255, 255, 255, 0.2); }

.sinv-page .sinv-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.625rem;
    margin-bottom: 1.25rem;
}
@media (min-width: 768px) {
    .sinv-page .sinv-stats { grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
}
.sinv-page .sinv-stat {
    padding: 0.85rem 1rem;
    border-radius: 0.85rem;
    background: var(--si-bg);
    border: 1px solid var(--si-line);
    box-shadow: var(--si-shadow);
}
.sinv-page .sinv-stat__label {
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--si-muted);
}
.sinv-page .sinv-stat__value {
    margin-top: 0.25rem;
    font-size: 1.25rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--si-ink);
    line-height: 1.1;
}
.sinv-page .sinv-stat__value--ok { color: var(--sinv-ok); }
.sinv-page .sinv-stat__value--warn { color: var(--sinv-warn); }
.sinv-page .sinv-stat__hint {
    margin-top: 0.15rem;
    font-size: 0.625rem;
    color: var(--si-muted);
}

.sinv-page .sinv-panel-accent { border-left: 3px solid var(--sinv-accent); }

.sinv-page .sinv-register-cta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.35rem;
    padding: 1.125rem 1.15rem;
    border-radius: 0.85rem;
    border: 1px solid var(--sinv-accent-line);
    background: linear-gradient(145deg, var(--sinv-accent-soft) 0%, #dbeafe 100%);
    text-align: left;
    transition: transform 0.15s, box-shadow 0.15s;
    width: 100%;
}
.sinv-page .sinv-register-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
}
.dark .sinv-page .sinv-register-cta {
    background: linear-gradient(145deg, rgba(37, 99, 235, 0.18) 0%, rgba(30, 64, 175, 0.12) 100%);
    border-color: rgba(191, 219, 254, 0.25);
}
.sinv-page .sinv-register-cta__icon {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 0.65rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(37, 99, 235, 0.15);
    color: var(--sinv-accent);
    font-size: 1rem;
}
.sinv-page .sinv-register-cta__title {
    font-size: 0.9375rem;
    font-weight: 800;
    color: #1e40af;
}
.dark .sinv-page .sinv-register-cta__title { color: #93c5fd; }
.sinv-page .sinv-register-cta__desc {
    font-size: 0.6875rem;
    line-height: 1.4;
    color: #3b82f6;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
}
.dark .sinv-page .sinv-register-cta__desc { color: #bfdbfe; }

.sinv-page .sinv-search-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: stretch;
    gap: 0.5rem;
    padding: 0.75rem;
    border-radius: 0.75rem;
    background: var(--si-surface);
    border: 1px solid var(--si-line);
    margin-bottom: 1rem;
}
.sinv-page .sinv-search-bar .si-search-wrap { flex: 1 1 14rem; max-width: none; }

.sinv-page .si-card {
    border-radius: 0.85rem;
    padding: 0.875rem;
    background: var(--si-bg);
    transition: box-shadow 0.15s, border-color 0.15s;
}
.sinv-page .si-card:hover { box-shadow: var(--si-shadow); }
.sinv-page .si-card.is-suspended {
    opacity: 0.78;
    border-color: #fde68a;
    background: var(--sinv-warn-soft);
}
.dark .sinv-page .si-card.is-suspended {
    background: rgba(180, 83, 9, 0.12);
    border-color: rgba(253, 230, 138, 0.3);
}

.sinv-page .sinv-list-panel .si-panel-head {
    background: linear-gradient(180deg, var(--si-surface) 0%, var(--si-bg) 100%);
}

.sinv-page .sinv-alert {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
    border-radius: 0.75rem;
    padding: 0.85rem 1.1rem;
    font-size: 0.8125rem;
    margin-bottom: 1.25rem;
}
.sinv-page .sinv-alert--info {
    background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
    border: 1px solid var(--sinv-accent-line);
    color: #1e40af;
}
.dark .sinv-page .sinv-alert--info {
    background: rgba(30, 64, 175, 0.2);
    border-color: rgba(191, 219, 254, 0.3);
    color: #93c5fd;
}

.sinv-page .sinv-modal-head {
    background: linear-gradient(128deg, var(--sinv-hero-from) 0%, var(--sinv-hero-to) 100%);
    border-bottom: none;
    padding: 1rem 1.25rem;
}
.sinv-page .sinv-modal-head h2 {
    color: #fff;
    font-size: 1rem;
    font-weight: 800;
}
.sinv-page .sinv-modal-head .si-btn--icon {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.2);
    color: #fff;
}
.sinv-page .sinv-modal-head .si-btn--icon:hover {
    background: rgba(255, 255, 255, 0.25);
    color: #fff;
}
.sinv-page .sinv-modal-ref {
    border-radius: 0.65rem;
    border: 1px dashed var(--sinv-accent-line);
    background: var(--sinv-accent-soft);
    padding: 0.75rem 0.9rem;
    font-size: 0.75rem;
    color: #1e40af;
    margin-bottom: 1rem;
}
.dark .sinv-page .sinv-modal-ref {
    background: rgba(37, 99, 235, 0.12);
    border-color: rgba(191, 219, 254, 0.25);
    color: #93c5fd;
}

.si-page .si-select--fee-votes {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.01em;
    line-height: 1.35;
}
.si-page .si-select--fee-votes option {
    font-family: inherit;
    font-size: inherit;
    padding: 0.25rem 0.5rem;
    white-space: pre;
}

.sinv-page .sinv-results-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.6875rem;
    font-weight: 700;
    background: var(--sinv-accent-soft);
    color: var(--sinv-accent);
    border: 1px solid var(--sinv-accent-line);
}

.sinv-page .sinv-catalog-table-wrap {
    max-width: 100%;
}
.sinv-page .sinv-catalog-table {
    min-width: 64rem;
    font-size: 0.8125rem;
