{% include 'dashboards/includes/store_inventory_page_styles.html' %}
<style>
/* â€”â€” Store stock page â€”â€” */
.si-page.ss-page {
    --ss-in: #059669;
    --ss-in-soft: #ecfdf5;
    --ss-in-line: #a7f3d0;
    --ss-out: #ea580c;
    --ss-out-soft: #fff7ed;
    --ss-out-line: #fed7aa;
    --ss-hero-from: #0c4a6e;
    --ss-hero-mid: #134e4a;
    --ss-hero-to: #0f766e;
}

/* Hero */
.ss-page .ss-hero {
    position: relative;
    margin-bottom: 1.25rem;
    border-radius: 1rem;
    overflow: hidden;
    background: linear-gradient(128deg, var(--ss-hero-from) 0%, var(--ss-hero-mid) 42%, var(--ss-hero-to) 100%);
    box-shadow: 0 10px 40px rgba(15, 118, 110, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
}
.ss-page .ss-hero::before {
    content: "";
    position: absolute;
    top: -35%;
    right: -8%;
    width: 42%;
    height: 140%;
    background: radial-gradient(ellipse, rgba(45, 212, 191, 0.28) 0%, transparent 68%);
    pointer-events: none;
}
.ss-page .ss-hero__inner {
    position: relative;
    z-index: 1;
    padding: 1.25rem 1.35rem 1.35rem;
}
@media (min-width: 640px) {
    .ss-page .ss-hero__inner { padding: 1.5rem 1.75rem 1.65rem; }
}
.ss-page .ss-hero__top {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
}
.ss-page .ss-hero__back {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.72);
    margin-bottom: 0.5rem;
    transition: color 0.15s;
}
.ss-page .ss-hero__back:hover { color: #fff; }
.ss-page .ss-hero__icon {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.875rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 1.125rem;
    flex-shrink: 0;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
}
.ss-page .ss-hero__title {
    font-size: 1.375rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #fff;
    line-height: 1.2;
}
@media (min-width: 640px) { .ss-page .ss-hero__title { font-size: 1.625rem; } }
.ss-page .ss-hero__sub {
    margin-top: 0.45rem;
    max-width: 36rem;
    font-size: 0.8125rem;
    line-height: 1.55;
    color: rgba(255, 255, 255, 0.78);
}
.ss-page .ss-hero__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 1rem;
}
.ss-page .ss-hero__link {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.45rem 0.85rem;
    border-radius: 999px;
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.16);
    transition: background 0.15s;
}
.ss-page .ss-hero__link:hover { background: rgba(255, 255, 255, 0.2); }

.ss-page .ss-hero__btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.55rem 1rem;
    border-radius: 999px;
    font-size: 0.6875rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #fff;
    border: 1px solid transparent;
    transition: transform 0.15s, filter 0.15s, box-shadow 0.15s;
}
.ss-page .ss-hero__btn:hover:not(:disabled) {
    transform: translateY(-1px);
    filter: brightness(1.06);
}
.ss-page .ss-hero__btn:disabled { opacity: 0.45; cursor: not-allowed; }
.ss-page .ss-hero__btn--in {
    background: linear-gradient(135deg, #047857, var(--ss-in));
    box-shadow: 0 4px 14px rgba(5, 150, 105, 0.35);
    border-color: rgba(255, 255, 255, 0.12);
}
.ss-page .ss-hero__btn--out {
    background: linear-gradient(135deg, #c2410c, var(--ss-out));
    box-shadow: 0 4px 14px rgba(234, 88, 12, 0.3);
    border-color: rgba(255, 255, 255, 0.12);
}

/* Catalog table */
.ss-page .ss-catalog-panel {
    border-left: 3px solid var(--ss-in);
}
.ss-page .ss-table--catalog tbody tr {
    transition: background 0.12s;
}
.ss-page .ss-catalog-row {
    cursor: pointer;
}
.ss-page .ss-table--catalog tbody tr.ss-catalog-row:hover {
    background: color-mix(in srgb, var(--ss-in) 6%, transparent);
}
.ss-page .ss-table--catalog th:nth-child(4),
.ss-page .ss-table--catalog td.ss-on-hand-cell {
    text-align: left;
    vertical-align: middle;
}
.ss-page .si-stock-qty {
    display: inline-flex;
    align-items: baseline;
    gap: 0.25rem;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    white-space: nowrap;
}
.ss-page .si-stock-qty .si-stock-num { font-size: 0.875rem; color: var(--si-ink); }
.ss-page .si-stock-qty .si-stock-unit { font-size: 0.625rem; font-weight: 600; color: var(--si-muted); text-transform: uppercase; }
.ss-page .si-stock-qty.is-zero .si-stock-num { color: var(--si-muted); }
.ss-page .si-stock-qty.is-low .si-stock-num { color: #b45309; }
.ss-page .si-stock-qty.is-ok .si-stock-num { color: #047857; }
.dark .ss-page .si-stock-qty.is-low .si-stock-num { color: #fcd34d; }
.dark .ss-page .si-stock-qty.is-ok .si-stock-num { color: #6ee7b7; }
.ss-page .ss-row-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.3rem;
    padding: 0.35rem 0.65rem;
    font-size: 0.625rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    border-radius: 0.5rem;
    border: 1px solid transparent;
}
.ss-page .ss-row-btn--in {
    background: var(--ss-in-soft);
    color: #047857;
    border-color: var(--ss-in-line);
}
.ss-page .ss-row-btn--in:hover:not(:disabled) {
    background: var(--ss-in);
    color: #fff;
}
.ss-page .ss-row-btn--out {
    background: var(--ss-out-soft);
    color: #c2410c;
    border-color: var(--ss-out-line);
}
.ss-page .ss-row-btn--out:hover:not(:disabled) {
    background: var(--ss-out);
    color: #fff;
}
.dark .ss-page .ss-row-btn--in { color: #6ee7b7; }
.dark .ss-page .ss-row-btn--out { color: #fdba74; }

/* Movement modal */
.ss-page .ss-movement-modal-overlay {
    padding-bottom: env(safe-area-inset-bottom, 0);
}
.ss-page .ss-movement-modal {
    display: flex;
    flex-direction: column;
    max-width: min(100%, 36rem);
}
@media (min-width: 640px) {
    .ss-page .ss-movement-modal {
        max-height: min(88dvh, 88vh);
    }
}
.ss-page .ss-movement-modal__form {
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    min-height: 0;
}
.ss-page .ss-movement-modal__body {
    flex: 1 1 auto;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 1rem 1rem 0.5rem;
}
@media (min-width: 640px) {
    .ss-page .ss-movement-modal__body {
        padding: 1.25rem 1.25rem 0.75rem;
    }
}
.ss-page .ss-movement-modal__footer {
    display: flex;
    flex-direction: column-reverse;
    gap: 0.5rem;
    flex-shrink: 0;
    padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom, 0));
    border-top: 1px solid var(--si-line);
    background: var(--si-bg);
    box-shadow: 0 -8px 24px rgba(15, 23, 42, 0.06);
}
@media (min-width: 640px) {
    .ss-page .ss-movement-modal__footer {
        flex-direction: row;
        justify-content: flex-end;
        padding: 0.85rem 1.25rem 1.25rem;
        box-shadow: none;
    }
}
.ss-page .ss-modal-head {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 0.85rem 1rem 0.9rem;
    border-bottom: 1px solid var(--si-line);
}
@media (min-width: 640px) {
    .ss-page .ss-modal-head {
        padding: 1rem 1.15rem;
    }
}
.ss-page .ss-modal-head__row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    width: 100%;
}
.ss-page .ss-modal-head__toolbar {
    width: 100%;
}
.ss-page .ss-modal-head--in {
    background: linear-gradient(128deg, #065f46 0%, var(--ss-in) 100%);
    border-bottom-color: rgba(255, 255, 255, 0.12);
}
.ss-page .ss-modal-head--out {
    background: linear-gradient(128deg, #9a3412 0%, var(--ss-out) 100%);
    border-bottom-color: rgba(255, 255, 255, 0.12);
}
.ss-page .ss-modal-head__eyebrow {
    font-size: 0.5625rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.72);
    margin-bottom: 0.15rem;
}
.ss-page .ss-modal-head__title {
    font-size: clamp(1rem, 4.5vw, 1.0625rem);
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.01em;
    line-height: 1.25;
}
.ss-page .ss-modal-close {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    border-radius: 0.5rem;
    background: rgba(255, 255, 255, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
    transition: background 0.15s;
}
.ss-page .ss-modal-close:hover { background: rgba(255, 255, 255, 0.28); }
.ss-page .ss-mode-tabs--compact {
    min-width: 0;
    width: 100%;
    padding: 0.2rem;
    background: rgba(0, 0, 0, 0.15);
    border-color: rgba(255, 255, 255, 0.15);
}
@media (min-width: 640px) {
    .ss-page .ss-mode-tabs--compact {
        min-width: 7rem;
        width: auto;
    }
}
.ss-page .ss-mode-tabs--modal .ss-mode-tab {
    font-size: 0.6875rem;
    padding: 0.5rem 0.65rem;
}
.ss-page .ss-mode-tabs--compact .ss-mode-tab {
    font-size: 0.6875rem;
    padding: 0.4rem 0.65rem;
    color: rgba(255, 255, 255, 0.75);
}
.ss-page .ss-modal-select {
    width: 100%;
    max-width: 100%;
    text-overflow: ellipsis;
}
.ss-page .ss-stock-in-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 1rem;
}
@media (min-width: 480px) {
    .ss-page .ss-stock-in-grid--price-total {
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
        align-items: start;
    }
}
.ss-page .ss-supplier-fields {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 0.75rem;
}
@media (min-width: 480px) {
    .ss-page .ss-supplier-fields {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    }
}
.ss-page .ss-mode-tabs--compact .ss-mode-tab.is-in.is-active,
.ss-page .ss-mode-tabs--compact .ss-mode-tab.is-out.is-active {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

/* Stats strip */
.ss-page .ss-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.625rem;
    margin-bottom: 1.25rem;
}
@media (min-width: 768px) {
    .ss-page .ss-stats { grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
}
.ss-page .ss-stat {
    padding: 0.85rem 1rem;
    border-radius: 0.85rem;
    background: var(--si-bg);
    border: 1px solid var(--si-line);
    box-shadow: var(--si-shadow);
}
.ss-page .ss-stat__label {
    font-size: 0.625rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--si-muted);
}
.ss-page .ss-stat__value {
    margin-top: 0.25rem;
    font-size: 1.25rem;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--si-ink);
    line-height: 1.1;
}
.ss-page .ss-stat__value--in { color: var(--ss-in); }
.ss-page .ss-stat__value--out { color: var(--ss-out); }
.ss-page .ss-stat__hint {
    margin-top: 0.15rem;
    font-size: 0.625rem;
    color: var(--si-muted);
}

/* Page stack (full-width sections) */
.ss-page .ss-page-stack {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
}

/* Work area â€” register + movement side by side on desktop */
.ss-page .ss-work-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.25rem;
    align-items: start;
}
@media (min-width: 1024px) {
    .ss-page .ss-work-grid {
        grid-template-columns: minmax(0, 0.48fr) minmax(0, 0.52fr);
    }
}

/* Register CTA */
.ss-page .ss-register-cta {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.35rem;
    padding: 1.125rem 1.15rem;
    border-radius: 0.85rem;
    border: 1px solid var(--ss-in-line);
    background: linear-gradient(145deg, var(--ss-in-soft) 0%, #ccfbf1 100%);
    text-align: left;
    transition: transform 0.15s, box-shadow 0.15s;
    width: 100%;
}
.ss-page .ss-register-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(5, 150, 105, 0.12);
}
.dark .ss-page .ss-register-cta {
    background: linear-gradient(145deg, rgba(4, 120, 87, 0.2) 0%, rgba(6, 95, 70, 0.12) 100%);
    border-color: rgba(167, 243, 208, 0.25);
}
.ss-page .ss-register-cta__icon {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 0.65rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(5, 150, 105, 0.15);
    color: var(--ss-in);
    font-size: 1rem;
}
.ss-page .ss-register-cta__title {
    font-size: 0.9375rem;
    font-weight: 800;
    color: #065f46;
}
.dark .ss-page .ss-register-cta__title { color: #6ee7b7; }
.ss-page .ss-register-cta__desc {
    font-size: 0.6875rem;
    line-height: 1.4;
    color: #047857;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
}
.dark .ss-page .ss-register-cta__desc { color: #a7f3d0; }

.ss-page .ss-movement-panel {
    border-left: 3px solid var(--ss-out);
}
.ss-page .ss-movement-panel__head {
    background: linear-gradient(180deg, var(--ss-out-soft) 0%, var(--si-bg) 100%);
}
.dark .ss-page .ss-movement-panel__head {
    background: linear-gradient(180deg, rgba(234, 88, 12, 0.1) 0%, var(--si-bg) 100%);
}

.ss-page .ss-form-panel__head {
    background: var(--si-surface);
    flex-wrap: wrap;
    gap: 0.75rem;
}
.ss-page .ss-form-panel__eyebrow {
    font-size: 0.625rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--si-muted);
    margin-bottom: 0.15rem;
}
.ss-page .ss-picker-box {
    padding: 0.85rem;
    border-radius: 0.75rem;
    border: 1px solid var(--si-line);
    background: var(--si-surface);
}
.ss-page .ss-picker-search {
    padding: 0.5rem;
    margin-bottom: 0;
    background: var(--si-bg);
}

.ss-page .ss-results-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.25rem 0.65rem;
    border-radius: 999px;
    font-size: 0.6875rem;
    font-weight: 700;
    background: var(--ss-in-soft);
    color: #047857;
    border: 1px solid var(--ss-in-line);
}
.dark .ss-page .ss-results-badge {
    background: rgba(5, 150, 105, 0.15);
    border-color: rgba(167, 243, 208, 0.25);
    color: #6ee7b7;
}

.ss-page .ss-table-wrap {
    border-radius: 0.75rem;
    overflow: hidden;
}
.ss-page .ss-table--movements tbody tr {
    transition: background 0.12s;
}
.ss-page .ss-table--movements tbody tr.ss-row--in:hover {
    background: color-mix(in srgb, var(--ss-in) 5%, transparent);
}
.ss-page .ss-table--movements tbody tr.ss-row--out:hover {
    background: color-mix(in srgb, var(--ss-out) 5%, transparent);
}

.ss-page .ss-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.12rem 0.45rem;
    border-radius: 999px;
    font-size: 0.5625rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    text-transform: uppercase;
}
.ss-page .ss-type-badge--in {
    background: var(--ss-in-soft);
    color: #047857;
    border: 1px solid var(--ss-in-line);
}
.ss-page .ss-type-badge--out {
    background: var(--ss-out-soft);
    color: #c2410c;
    border: 1px solid var(--ss-out-line);
}

.ss-page .ss-pay-badge {
    display: inline-block;
    padding: 0.15rem 0.45rem;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.625rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
}
.ss-page .ss-pay-badge--pending {
    background: #fef3c7;
    color: #b45309;
}
.ss-page .ss-pay-badge--paid {
    background: #ecfdf5;
    color: #047857;
    border: 1px solid var(--ss-in-line);
}
.ss-page .ss-pay-badge--partial {
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
}
.ss-page .ss-pay-badge--muted {
    background: var(--si-surface);
    color: var(--si-muted);
    border: 1px solid var(--si-line);
}

.ss-page .ss-list-panel__head {
    background: linear-gradient(180deg, var(--si-surface) 0%, var(--si-bg) 100%);
}

/* List tables â€” always visible, scroll on small screens */
.ss-page .ss-list-table {
    display: block;
    overflow-x: auto;
}
.ss-page .ss-list-panel .si-panel-body {
    padding-top: 0.75rem;
}

/* Action cards */
.ss-page .ss-action-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.75rem;
}
@media (min-width: 480px) {
    .ss-page .ss-action-grid { grid-template-columns: 1fr 1fr; }
}
.ss-page .ss-action-btn {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 0.35rem;
    padding: 1.125rem 1.15rem;
    border-radius: 0.85rem;
    border: 1px solid transparent;
    text-align: left;
    transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    min-height: 6.5rem;
}
.ss-page .ss-action-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
}
.ss-page .ss-action-btn:active:not(:disabled) { transform: translateY(0); }
.ss-page .ss-action-btn:disabled { opacity: 0.48; cursor: not-allowed; }
.ss-page .ss-action-btn__icon {
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 0.65rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
}
.ss-page .ss-action-btn__title {
    font-size: 0.9375rem;
    font-weight: 800;
    letter-spacing: -0.01em;
}
.ss-page .ss-action-btn__desc {
    font-size: 0.6875rem;
    line-height: 1.4;
    opacity: 0.85;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
}
.ss-page .ss-action-btn--in {
    background: linear-gradient(145deg, #ecfdf5 0%, #d1fae5 100%);
    border-color: var(--ss-in-line);
    color: #065f46;
}
.ss-page .ss-action-btn--in .ss-action-btn__icon {
    background: rgba(5, 150, 105, 0.15);
    color: var(--ss-in);
}
.ss-page .ss-action-btn--out {
    background: linear-gradient(145deg, #fff7ed 0%, #ffedd5 100%);
    border-color: var(--ss-out-line);
    color: #9a3412;
}
.ss-page .ss-action-btn--out .ss-action-btn__icon {
    background: rgba(234, 88, 12, 0.12);
    color: var(--ss-out);
}
.dark .ss-page .ss-action-btn--in {
    background: linear-gradient(145deg, rgba(4, 120, 87, 0.2) 0%, rgba(6, 95, 70, 0.12) 100%);
    border-color: rgba(167, 243, 208, 0.25);
    color: #6ee7b7;
}
.dark .ss-page .ss-action-btn--out {
    background: linear-gradient(145deg, rgba(194, 65, 12, 0.18) 0%, rgba(154, 52, 18, 0.1) 100%);
    border-color: rgba(254, 215, 170, 0.25);
    color: #fdba74;
