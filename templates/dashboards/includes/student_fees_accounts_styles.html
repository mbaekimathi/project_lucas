{% include 'dashboards/includes/payroll_accounts_styles.html' %}
<style>
.sf-page { color: var(--acc-ink); }
.sf-hero-sub { color: rgba(226, 232, 240, 0.9); }
.sf-panel {
    background: var(--acc-surface);
    border: 1px solid var(--acc-line);
    box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 12px 32px -8px rgba(15,23,42,0.08);
}
.sf-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--acc-line);
}
.sf-panel-title {
    font-size: 0.9375rem;
    font-weight: 600;
    color: var(--acc-ink);
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
.sf-panel-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2rem;
    height: 2rem;
    border-radius: 0.5rem;
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: #fff;
    font-size: 0.75rem;
    box-shadow: 0 2px 6px rgba(13,148,136,0.3);
}
.sf-clear-btn {
    font-size: 0.75rem;
    font-weight: 600;
    color: #0f766e;
    padding: 0.375rem 0.75rem;
    border-radius: 0.5rem;
    border: 1px solid var(--acc-line);
    background: var(--acc-surface);
    transition: background 0.15s ease, color 0.15s ease;
}
.sf-clear-btn:hover { background: #f0fdfa; color: #134e4a; }
.dark .sf-clear-btn { color: #5eead4; }
.dark .sf-clear-btn:hover { background: rgba(13,148,136,0.15); }
.sf-field-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--acc-muted);
    margin-bottom: 0.375rem;
}
.sf-input, .sf-select {
    width: 100%;
    min-height: 2.5rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    border: 1px solid var(--acc-line);
    border-radius: 0.5rem;
    background: #fafbfc;
    color: var(--acc-ink);
}
.dark .sf-input, .dark .sf-select { background: #0f172a; }
.sf-input:focus, .sf-select:focus {
    border-color: #14b8a6;
    box-shadow: 0 0 0 3px rgba(20,184,166,0.2);
    outline: none;
}
.sf-input-with-icon { padding-left: 2.25rem; }
.sf-input-icon {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    pointer-events: none;
    font-size: 0.875rem;
}
.sf-table thead th {
    background: #f1f5f9;
    color: #475569;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-size: 0.65rem;
    text-transform: uppercase;
}
.dark .sf-table thead th { background: #1e293b; color: #94a3b8; }
.sf-table tbody tr { transition: background 0.15s ease; }
.sf-table tbody tr:hover { background: #f0fdfa; }
.dark .sf-table tbody tr:hover { background: rgba(13,148,136,0.08); }
.sf-table-hero thead th {
    background: transparent;
    color: rgba(255,255,255,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}
.sf-year-chip {
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    border: 1px solid var(--acc-line);
    background: var(--acc-surface);
    color: var(--acc-ink);
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
}
.sf-year-chip:hover { border-color: #14b8a6; background: #f0fdfa; }
.sf-year-chip.is-active {
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(13,148,136,0.35);
}
.sf-year-chip .sf-current-badge {
    margin-left: 0.25rem;
    padding: 0.125rem 0.375rem;
    font-size: 0.625rem;
    font-weight: 700;
    border-radius: 9999px;
    background: rgba(255,255,255,0.25);
    color: #fff;
}
.sf-stat-card {
    background: var(--acc-surface);
    border: 1px solid var(--acc-line);
    border-radius: 0.75rem;
    padding: 1rem;
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
}
.dark .sf-stat-card { background: #1e293b; }
.sf-stat-label { font-size: 0.75rem; font-weight: 600; color: var(--acc-muted); margin-bottom: 0.25rem; }
.sf-stat-value { font-size: 1.5rem; font-weight: 700; color: var(--acc-ink); line-height: 1.2; }
.sf-stat-icon {
    width: 2.75rem;
    height: 2.75rem;
    border-radius: 0.625rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.125rem;
}
.sf-stat-icon--teal { background: rgba(13,148,136,0.15); color: #0d9488; }
.sf-stat-icon--blue { background: rgba(59,130,246,0.15); color: #2563eb; }
.sf-stat-icon--amber { background: rgba(245,158,11,0.15); color: #d97706; }
.sf-stat-icon--violet { background: rgba(139,92,246,0.15); color: #7c3aed; }
.sf-modal-backdrop {
    background: rgba(15, 23, 42, 0.55);
    backdrop-filter: blur(4px);
}
.sf-modal-panel {
    background: var(--acc-surface);
    border: 1px solid var(--acc-line);
    box-shadow: 0 24px 48px -12px rgba(15,23,42,0.35);
    border-radius: 1rem;
    overflow: hidden;
}
.sf-modal-head {
    background: linear-gradient(125deg, #0f172a 0%, #1e3a5f 38%, #134e4a 100%);
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
}
.sf-modal-head h2 { color: #fff; font-weight: 700; font-size: 1rem; margin: 0; }
.sf-modal-head .sf-modal-close {
    color: rgba(255,255,255,0.85);
    padding: 0.375rem;
    border-radius: 0.375rem;
    transition: background 0.15s ease;
}
.sf-modal-head .sf-modal-close:hover { background: rgba(255,255,255,0.15); color: #fff; }
.sf-modal-panel--create .sf-modal-body {
    max-height: min(72vh, 640px);
}
.sf-modal-body {
    padding: 1rem 1.25rem;
    max-height: min(65vh, 560px);
    overflow-y: auto;
}
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}
.sf-required { color: #ef4444; font-weight: 700; }
.sf-link {
    color: #0d9488;
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 2px;
}
.sf-link:hover { color: #0f766e; }
.dark .sf-link { color: #5eead4; }

/* Form sections (Academic Levels, Fee Items) */
.sf-form-section {
    border: 1px solid var(--acc-line);
    border-radius: 0.75rem;
    overflow: hidden;
    background: #fafbfc;
}
.dark .sf-form-section { background: rgba(15, 23, 42, 0.45); }
.sf-form-section--levels {
    border-color: color-mix(in srgb, #0d9488 22%, var(--acc-line));
}
.sf-form-section--items {
    border-color: color-mix(in srgb, #2563eb 18%, var(--acc-line));
}
.sf-form-section__header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: linear-gradient(180deg, #fff 0%, #f8fafc 100%);
    border-bottom: 1px solid var(--acc-line);
}
.dark .sf-form-section__header {
    background: linear-gradient(180deg, rgba(30,41,59,0.9) 0%, rgba(15,23,42,0.6) 100%);
}
.sf-form-section__title-wrap {
    display: flex;
    align-items: flex-start;
    gap: 0.625rem;
    min-width: 0;
    flex: 1;
}
.sf-form-section__icon {
    flex-shrink: 0;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.875rem;
}
.sf-form-section__icon--levels {
    background: color-mix(in srgb, #0d9488 14%, #fff);
    color: #0d9488;
}
.sf-form-section__icon--items {
    background: color-mix(in srgb, #2563eb 12%, #fff);
    color: #2563eb;
}
.dark .sf-form-section__icon--levels {
    background: color-mix(in srgb, #0d9488 22%, #1e293b);
    color: #5eead4;
}
.dark .sf-form-section__icon--items {
    background: color-mix(in srgb, #2563eb 20%, #1e293b);
    color: #93c5fd;
}
.sf-form-section__title {
    margin: 0;
    font-size: 0.8125rem;
    font-weight: 700;
    color: var(--acc-ink);
    letter-spacing: 0.01em;
    text-transform: none;
}
.sf-form-section__hint {
    margin: 0.25rem 0 0;
    font-size: 0.6875rem;
    line-height: 1.4;
    color: var(--acc-muted);
    font-weight: 400;
    text-transform: none;
    letter-spacing: normal;
}
.sf-form-section__body {
    padding: 0.75rem 1rem 1rem;
}
.sf-selection-badge {
    flex-shrink: 0;
    font-size: 0.625rem;
    font-weight: 700;
    padding: 0.25rem 0.5rem;
    border-radius: 9999px;
    background: #e2e8f0;
    color: #64748b;
    max-width: 10rem;
    text-align: center;
    line-height: 1.3;
}
.sf-selection-badge.is-active {
    background: color-mix(in srgb, #0d9488 16%, #fff);
    color: #0f766e;
    border: 1px solid color-mix(in srgb, #0d9488 30%, transparent);
}
.dark .sf-selection-badge { background: #334155; color: #94a3b8; }
.dark .sf-selection-badge.is-active {
    background: color-mix(in srgb, #0d9488 25%, #1e293b);
    color: #5eead4;
    border-color: color-mix(in srgb, #0d9488 40%, transparent);
}
.sf-section-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    padding: 1.5rem 1rem;
    text-align: center;
    border: 2px dashed var(--acc-line);
    border-radius: 0.5rem;
    background: #fff;
    color: var(--acc-muted);
    font-size: 0.75rem;
    line-height: 1.5;
}
.sf-section-placeholder i {
    font-size: 1.25rem;
    color: #94a3b8;
    opacity: 0.8;
}
.dark .sf-section-placeholder { background: rgba(15,23,42,0.5); }
.sf-empty-inline {
    font-size: 0.75rem;
    color: var(--acc-muted);
    text-align: center;
    padding: 0.75rem;
    margin: 0;
}
.sf-level-toolbar {
    display: flex;
    justify-content: flex-end;
}
.sf-level-footer {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.6875rem;
    font-weight: 600;
    color: #0f766e;
    padding: 0.5rem 0.625rem;
    border-radius: 0.375rem;
    background: color-mix(in srgb, #0d9488 10%, #fff);
    border: 1px solid color-mix(in srgb, #0d9488 25%, transparent);
}
.sf-level-footer i { color: #0d9488; }
.dark .sf-level-footer {
    color: #5eead4;
    background: color-mix(in srgb, #0d9488 18%, #0f172a);
}
.sf-btn-outline.is-active {
    border-color: #0d9488;
    background: color-mix(in srgb, #0d9488 10%, #fff);
    color: #0f766e;
}
.sf-modal-body label:not(.sf-level-option) {
    display: block;
    font-size: 0.6875rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--acc-muted);
    margin-bottom: 0.375rem;
}
.sf-modal-body select,
.sf-modal-body input[type="text"],
.sf-modal-body input[type="number"],
.sf-modal-body input[type="date"] {
    width: 100%;
    min-height: 2.5rem;
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    border: 1px solid var(--acc-line);
    border-radius: 0.5rem;
    background: #fafbfc;
    color: var(--acc-ink);
}
.dark .sf-modal-body select,
.dark .sf-modal-body input[type="text"],
.dark .sf-modal-body input[type="number"],
.dark .sf-modal-body input[type="date"] { background: #0f172a; }
.sf-modal-body select:disabled,
.sf-modal-body input:disabled { opacity: 0.55; cursor: not-allowed; }
.sf-modal-body select:focus,
.sf-modal-body input:focus {
    border-color: #14b8a6;
    box-shadow: 0 0 0 3px rgba(20,184,166,0.2);
    outline: none;
}
.sf-level-picker {
    max-height: 9rem;
    overflow-y: auto;
    border: 1px solid var(--acc-line);
    border-radius: 0.5rem;
    padding: 0.5rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.375rem;
}
@media (min-width: 640px) { .sf-level-picker { grid-template-columns: 1fr 1fr; } }
.sf-level-picker-grouped {
    max-height: min(16rem, 40vh);
    overflow-y: auto;
    border: 1px solid var(--acc-line);
    border-radius: 0.5rem;
    padding: 0.625rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    background: #fff;
    scrollbar-width: thin;
}
.dark .sf-level-picker-grouped { background: rgba(15, 23, 42, 0.35); }
.sf-level-category-block {
    border: 1px solid var(--acc-line);
    border-radius: 0.5rem;
    overflow: hidden;
    background: #fff;
}
.dark .sf-level-category-block { background: rgba(15, 23, 42, 0.5); }
.sf-level-combined-block {
    border-color: color-mix(in srgb, #0d9488 28%, var(--acc-line));
    background: color-mix(in srgb, #0d9488 5%, #fff);
}
.dark .sf-level-combined-block {
    background: color-mix(in srgb, #0d9488 12%, #0f172a);
    border-color: color-mix(in srgb, #0d9488 35%, #374151);
}
.sf-level-category-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.375rem 0.5rem;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #475569;
    background: #f1f5f9;
    border-bottom: 1px solid var(--acc-line);
}
.dark .sf-level-category-head {
    color: #cbd5e1;
    background: rgba(30, 41, 59, 0.6);
}
.sf-level-category-body {
    padding: 0.375rem;
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.375rem;
}
@media (min-width: 640px) {
    .sf-level-category-body { grid-template-columns: 1fr 1fr; }
}
.sf-level-combo-option { grid-column: 1 / -1; }
.sf-level-picker--all-selected .sf-level-option.is-locked-selected {
    border-color: color-mix(in srgb, #0d9488 35%, var(--acc-line));
    background: color-mix(in srgb, #0d9488 8%, #f0fdfa);
}
.dark .sf-level-picker--all-selected .sf-level-option.is-locked-selected {
    background: color-mix(in srgb, #0d9488 18%, #0f172a);
    border-color: color-mix(in srgb, #0d9488 40%, #374151);
}
.sf-level-option.is-locked-selected input[type="checkbox"] { cursor: default; }
.sf-btn-xs {
    font-size: 0.625rem;
    padding: 0.125rem 0.375rem;
    line-height: 1.2;
}
.sf-level-option {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
    padding: 0.5rem 0.625rem;
    border-radius: 0.5rem;
    border: 1px solid var(--acc-line);
    font-size: 0.8125rem;
    line-height: 1.35;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}
.sf-level-option:has(input:checked) {
    border-color: color-mix(in srgb, #0d9488 45%, var(--acc-line));
    background: color-mix(in srgb, #0d9488 8%, #f0fdfa);
    box-shadow: 0 0 0 1px color-mix(in srgb, #0d9488 12%, transparent);
}
.sf-level-option:hover { border-color: #14b8a6; background: #f0fdfa; }
.dark .sf-level-option:has(input:checked) {
    background: color-mix(in srgb, #0d9488 16%, #0f172a);
}
.sf-level-option input[type="checkbox"] {
    width: 1rem;
    height: 1rem;
    margin-top: 0.125rem;
    flex-shrink: 0;
}
.sf-level-option.is-conflict {
    border-color: #fca5a5;
    background: #fef2f2;
}
.dark .sf-level-option.is-conflict { background: rgba(127,29,29,0.25); border-color: #b91c1c; }
.sf-level-option input[type="checkbox"] { accent-color: #0d9488; }
.sf-modal-footer {
    display: flex;
    flex-direction: column-reverse;
    gap: 0.5rem;
    padding-top: 0.75rem;
    margin-top: 0.25rem;
    border-top: 1px solid var(--acc-line);
}
@media (min-width: 640px) {
    .sf-modal-footer { flex-direction: row; align-items: center; justify-content: flex-end; }
}
.sf-btn-teal {
    background: linear-gradient(135deg, #0d9488, #0f766e);
    color: #fff !important;
    box-shadow: 0 2px 10px rgba(13,148,136,0.35);
    border-radius: 0.5rem;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    font-weight: 600;
    transition: filter 0.15s ease;
}
.sf-btn-teal:hover { filter: brightness(1.06); }
.sf-btn-teal:disabled { opacity: 0.5; cursor: not-allowed; }
.sf-btn-ghost {
    border: 1px solid var(--acc-line);
    background: var(--acc-surface);
    color: var(--acc-ink);
    border-radius: 0.5rem;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
}
.sf-btn-ghost:hover { background: #f1f5f9; }
.dark .sf-btn-ghost { background: #1e293b; }
.dark .sf-btn-ghost:hover { background: #334155; }
.sf-btn-sm {
    font-size: 0.75rem;
    padding: 0.375rem 0.625rem;
    border-radius: 0.375rem;
    font-weight: 600;
}
.sf-btn-outline {
    border: 1px solid var(--acc-line);
    background: var(--acc-surface);
    color: var(--acc-ink);
}
.sf-btn-outline:hover { background: #f1f5f9; }
.sf-total-box {
    background: linear-gradient(135deg, rgba(13,148,136,0.08), rgba(15,118,110,0.05));
    border: 1px solid rgba(20,184,166,0.25);
    border-radius: 0.75rem;
    padding: 0.75rem 1rem;
}
.dark .sf-total-box {
    background: rgba(13,148,136,0.15);
    border-color: rgba(45,212,191,0.3);
}
.sf-total-box .sf-total-value { font-size: 1.125rem; font-weight: 700; color: #0d9488; }
.dark .sf-total-box .sf-total-value { color: #5eead4; }
/* Fee items section */
.sf-fee-items-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
}
.sf-fee-items-toolbar .sf-btn-teal,
.sf-fee-items-toolbar .sf-btn-outline {
    display: inline-flex;
    align-items: center;
    gap: 0.375rem;
}
.sf-fee-library {
    border: 1px solid color-mix(in srgb, #2563eb 30%, var(--acc-line));
    border-radius: 0.5rem;
    overflow: hidden;
    background: #fff;
}
.dark .sf-fee-library { background: #0f172a; }
.sf-fee-library__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 0.75rem;
    font-size: 0.6875rem;
    font-weight: 700;
    color: #1e40af;
    background: color-mix(in srgb, #2563eb 8%, #fff);
    border-bottom: 1px solid var(--acc-line);
}
.dark .sf-fee-library__head { color: #93c5fd; background: color-mix(in srgb, #2563eb 15%, #1e293b); }
.sf-fee-library__close {
    padding: 0.25rem;
    color: var(--acc-muted);
    border-radius: 0.25rem;
}
.sf-fee-library__close:hover { background: rgba(0,0,0,0.06); color: var(--acc-ink); }
.sf-fee-library__list {
    max-height: 9rem;
    overflow-y: auto;
    padding: 0.375rem;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}
.sf-fee-library__item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    width: 100%;
    text-align: left;
    padding: 0.5rem 0.625rem;
    border-radius: 0.375rem;
    border: 1px solid transparent;
    font-size: 0.75rem;
    transition: background 0.12s ease, border-color 0.12s ease;
}
.sf-fee-library__item:hover {
    background: #f1f5f9;
    border-color: var(--acc-line);
}
.dark .sf-fee-library__item:hover { background: #1e293b; }
.sf-fee-library__name { font-weight: 600; color: var(--acc-ink); }
.sf-fee-library__amount {
    font-weight: 700;
    color: #0d9488;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
}
.dark .sf-fee-library__amount { color: #5eead4; }
.sf-fee-items-panel {
    border: 1px solid var(--acc-line);
    border-radius: 0.5rem;
    overflow: hidden;
    background: #fff;
}
