{# Apply saved light/dark before first paint — prevents flash on navigation #}
<script>
(function () {
    var defaultDark = {{ ((school_settings.default_theme_mode|default('dark')) == 'dark')|tojson }};

    window.__portalThemeConfig = { defaultDark: defaultDark };

    window.portalResolveDarkMode = function () {
        try {
            var explicit = localStorage.getItem('darkModeUserChoice');
            if (!explicit) {
                var legacy = localStorage.getItem('darkMode');
                if (legacy === 'true') explicit = 'dark';
                else if (legacy === 'false') explicit = 'light';
            }
            if (explicit === 'dark') return true;
            if (explicit === 'light') return false;
            return !!defaultDark;
        } catch (e) {
            return !!defaultDark;
        }
    };

    window.portalSaveDarkMode = function (isDark) {
        try {
            localStorage.setItem('darkModeUserChoice', isDark ? 'dark' : 'light');
            localStorage.setItem('darkMode', isDark ? 'true' : 'false');
        } catch (e) { /* private mode */ }
    };

    window.portalApplyDarkMode = function (isDark) {
        var root = document.documentElement;
        if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
        } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
        }
        if (document.body) {
            document.body.classList.toggle('dark', isDark);
        }
    };

    var isDark = window.portalResolveDarkMode();
    window.portalApplyDarkMode(isDark);
})();
</script>
<style id="theme-mode-boot">
    html { color-scheme: light; background-color: #f8fafc; }
    html.dark { color-scheme: dark; background-color: #020617; }
    html.role-portal-scroll { background-color: #eef2f6; }
    html.role-portal-scroll.dark { background-color: #0b1120; }
    body { background-color: inherit; color: #0f172a; }
    html.dark body { color: #f1f5f9; }
</style>
